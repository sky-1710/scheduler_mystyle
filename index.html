    <div class="form-group">
      <label class="form-label">색상</label>
      <div class="color-picker" id="habitColorPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="habitCancelBtn">취소</button>
      <button class="btn-delete" id="habitDeleteBtn" style="display:none">삭제</button>
      <button class="btn-save" id="habitSaveBtn">저장</button>
    </div>
  </div>
</div>

<!-- Task Picker Modal (pull tasks into a day) -->
<div class="modal-overlay" id="pickerModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="pickerTitle">할일 가져오기</div>
    <div class="day-modal-list" id="pickerList"></div>
    <button class="day-btn-close" id="pickerCloseBtn">완료</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== CONSTANTS =====
const COLORS = ['#5C6BC0','#EF4444','#10B981','#F59E0B','#8B5CF6','#EC4899','#06B6D4','#84CC16','#F97316','#64748B'];
const WEEKDAYS = ['일','월','화','수','목','금','토'];
const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const REPEAT_LABEL = { none:'없음', daily:'매일', weekly:'매주', monthly:'매월', yearly:'매년' };

function repeatLabel(ev) {
  if (ev.repeat === 'everyN') return `${Math.max(1, parseInt(ev.repeatN) || 1)}일마다`;
  return REPEAT_LABEL[ev.repeat] || '없음';
}
const PRIORITY_ICON = { high:'🔴', normal:'🟡', low:'🟢' };
const PRIORITY_LABEL = { high:'높음', normal:'보통', low:'낮음' };
const PRIORITY_RANK = { high: 0, normal: 1, low: 2 };
const prioRank = ev => PRIORITY_RANK[ev.priority || 'normal'];

// Completion is per-date for repeating todos, global otherwise
function isTodoDone(ev, ds) {
  if (ev.repeat && ev.repeat !== 'none') return (todoDone[ds] || []).includes(ev.id);
  return !!ev.completed;
}

function setTodoDone(ev, ds, val) {
  if (ev.repeat && ev.repeat !== 'none') {
    if (!todoDone[ds]) todoDone[ds] = [];
    const i = todoDone[ds].indexOf(ev.id);
    if (val && i < 0) todoDone[ds].push(ev.id);
    if (!val && i >= 0) todoDone[ds].splice(i, 1);
    if (!todoDone[ds].length) delete todoDone[ds];
  } else {
    ev.completed = val;
    if (val) ev.completedAt = ev.completedAt || todayStr();
    else delete ev.completedAt;
  }
}

function evPrefix(ev, ds) {
  const p = PRIORITY_ICON[ev.priority || 'normal'];
  const t = ev.isTodo ? (isTodoDone(ev, ds) ? '✅ ' : '☐ ') : '';
  return `${p} ${t}`;
}

// ===== STATE =====
let events = [];
let blocks = {};   // 10-min time blocks (visual): { 'YYYY-MM-DD': { 'HH:MM': eventId } }
let blockMin = {}; // minutes filled inside each block (1~10): { 'YYYY-MM-DD': { 'HH:MM': n } } (absent = 10)
let timeLog = {};  // minute-precise totals: { 'YYYY-MM-DD': { id: minutes } }
let dayTasks = {}; // tasks pulled into a day: { 'YYYY-MM-DD': [eventId, ...] }
let dayGoals = {}; // { 'YYYY-MM-DD': 'goal text' }
let dayMemos = {}; // { 'YYYY-MM-DD': 'memo text' }
let dayBad = {};     // { 'YYYY-MM-DD': '나쁜 습관/아쉬운 일' }
let dayRatings = {}; // { 'YYYY-MM-DD': 1~10 별점 }
let sleepLog = {};   // { 'YYYY-MM-DD': { wake: 'HH:MM', sleep: 'HH:MM' } }
let dayImages = {}; // { 'YYYY-MM-DD': [dataURL, ...] } (stored in IndexedDB)
let todoDone = {};  // per-date completion for REPEATING todos: { 'YYYY-MM-DD': [eventId, ...] }
let habits = [];      // [{ id, name, color, categoryId }]
let habitChecks = {}; // { 'YYYY-MM-DD': [habitId, ...] }
let habitEditingId = null;
let categories = [];  // nested via parentId: [{ id, name, color, parentId }]
let catEditingId = null;
let currentDate = new Date();
let currentView = 'month';
let editingId = null;
let selectedDay = null;
let isTodoMode = false;
let isDark = localStorage.getItem('dark') === '1';
let notifTimers = [];
let paintTaskId = null; // selected palette task id, or 'ERASE'
let dayRenderedFor = null;

// ===== STORAGE =====
function loadEvents() {
  try { events = JSON.parse(localStorage.getItem('sched_v1') || '[]'); } catch { events = []; }
  try { blocks = JSON.parse(localStorage.getItem('sched_blocks_v1') || '{}'); } catch { blocks = {}; }
  try { timeLog = JSON.parse(localStorage.getItem('sched_timelog_v1') || '{}'); } catch { timeLog = {}; }
  try { blockMin = JSON.parse(localStorage.getItem('sched_blockmin_v1') || '{}'); } catch { blockMin = {}; }
  try { dayTasks = JSON.parse(localStorage.getItem('sched_daytasks_v1') || '{}'); } catch { dayTasks = {}; }
  try { dayGoals = JSON.parse(localStorage.getItem('sched_daygoals_v1') || '{}'); } catch { dayGoals = {}; }
  try { dayMemos = JSON.parse(localStorage.getItem('sched_daymemos_v1') || '{}'); } catch { dayMemos = {}; }
  try { dayBad = JSON.parse(localStorage.getItem('sched_daybad_v1') || '{}'); } catch { dayBad = {}; }
  try { dayRatings = JSON.parse(localStorage.getItem('sched_dayratings_v1') || '{}'); } catch { dayRatings = {}; }
  try { sleepLog = JSON.parse(localStorage.getItem('sched_sleep_v1') || '{}'); } catch { sleepLog = {}; }
  try { habits = JSON.parse(localStorage.getItem('sched_habits_v1') || '[]'); } catch { habits = []; }
  try { habitChecks = JSON.parse(localStorage.getItem('sched_habitchecks_v1') || '{}'); } catch { habitChecks = {}; }
  try { todoDone = JSON.parse(localStorage.getItem('sched_tododone_v1') || '{}'); } catch { todoDone = {}; }
  try { categories = JSON.parse(localStorage.getItem('sched_categories_v1') || '[]'); } catch { categories = []; }
}
function persistLocal() {
  try {
    persistLocalUnsafe();
  } catch (err) {
    console.error('local save failed', err);
    showToast('⚠ 저장에 실패했습니다 — 브라우저 저장 공간을 확인해주세요');
  }
}

function persistLocalUnsafe() {
  localStorage.setItem('sched_v1', JSON.stringify(events));
  localStorage.setItem('sched_blocks_v1', JSON.stringify(blocks));
  localStorage.setItem('sched_timelog_v1', JSON.stringify(timeLog));
  localStorage.setItem('sched_blockmin_v1', JSON.stringify(blockMin));
  localStorage.setItem('sched_daytasks_v1', JSON.stringify(dayTasks));
  localStorage.setItem('sched_daygoals_v1', JSON.stringify(dayGoals));
  localStorage.setItem('sched_daymemos_v1', JSON.stringify(dayMemos));
  localStorage.setItem('sched_daybad_v1', JSON.stringify(dayBad));
  localStorage.setItem('sched_dayratings_v1', JSON.stringify(dayRatings));
  localStorage.setItem('sched_sleep_v1', JSON.stringify(sleepLog));
  localStorage.setItem('sched_habits_v1', JSON.stringify(habits));
  localStorage.setItem('sched_habitchecks_v1', JSON.stringify(habitChecks));
  localStorage.setItem('sched_tododone_v1', JSON.stringify(todoDone));
  localStorage.setItem('sched_categories_v1', JSON.stringify(categories));
}
function saveEvents() {
  persistLocal();
  autoSyncToFile();
}
loadEvents();

// ===== UTILS =====
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayStr = () => ymd(new Date());
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

function pad2(n) { return String(n).padStart(2,'0'); }

function formatDate(s) {
  if (!s) return '';
  const d = new Date(s + 'T00:00:00');
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
}

function formatTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  return `${h < 12 ? '오전' : '오후'} ${h===0?12:h>12?h-12:h}:${pad2(m)}`;
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

// ===== RECURRING LOGIC =====
function evMatchesDate(ev, date) {
  if (!ev.date) return false;
  if (ev.date === date) return true;
  // 기간 일정: 시작~종료 사이 매일 표시
  if (ev.endDate && (!ev.repeat || ev.repeat === 'none')) {
    return date > ev.date && date <= ev.endDate;
  }
  if (!ev.repeat || ev.repeat === 'none') return false;

  const evD = new Date(ev.date + 'T00:00:00');
  const chkD = new Date(date + 'T00:00:00');
  if (chkD <= evD) return false;
  if (ev.repeatEnd && date > ev.repeatEnd) return false;

  if (ev.repeat === 'daily') return true;
  if (ev.repeat === 'everyN') {
    const n = Math.max(1, parseInt(ev.repeatN) || 1);
    const diff = Math.round((chkD - evD) / 86400000);
    return diff % n === 0;
  }
  if (ev.repeat === 'weekly') return evD.getDay() === chkD.getDay();
  if (ev.repeat === 'monthly') return evD.getDate() === chkD.getDate();
  if (ev.repeat === 'yearly') {
    return evD.getMonth() === chkD.getMonth() && evD.getDate() === chkD.getDate();
  }
  return false;
}

function getEventsForDate(date) {
  // scoped (month/week) todos live in the sidebar, not on a specific day
  return events
    .filter(ev => !ev.scope && evMatchesDate(ev, date))
    .sort((a,b) => (a.time||'').localeCompare(b.time||'') || prioRank(a) - prioRank(b));
}

// ===== THEME =====
function applyTheme() {
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
}
applyTheme();

document.getElementById('themeBtn').onclick = () => {
  isDark = !isDark;
  localStorage.setItem('dark', isDark ? '1' : '0');
  applyTheme();
};

// ===== SIDEBAR TOGGLE =====
let sidebarHidden = localStorage.getItem('sidebarHidden') === '1';

function applySidebar() {
  document.body.classList.toggle('sidebar-hidden', sidebarHidden);
  document.getElementById('sidebarBtn').style.opacity = sidebarHidden ? '0.45' : '1';
}
applySidebar();

document.getElementById('sidebarBtn').onclick = () => {
  sidebarHidden = !sidebarHidden;
  localStorage.setItem('sidebarHidden', sidebarHidden ? '1' : '0');
  applySidebar();
};

// ===== TABS =====
function switchView(v) {
  currentView = v;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.view === v));
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  document.getElementById(v + 'View').classList.add('active');
  render();
}

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => switchView(t.dataset.view);
});

// ===== NAVIGATION =====
function navStep(dir) {
  if (currentView === 'stats') {
    if (statsPeriod === 'week') currentDate = new Date(currentDate.getTime() + dir * 7 * 86400000);
    else if (statsPeriod === 'year') currentDate = new Date(currentDate.getFullYear() + dir, currentDate.getMonth(), 1);
    else currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + dir, 1);
  } else if (currentView === 'month' || currentView === 'habit') {
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + dir, 1);
  } else if (currentView === 'week') {
    currentDate = new Date(currentDate.getTime() + dir * 7 * 86400000);
  } else if (currentView === 'day') {
    currentDate = new Date(currentDate.getTime() + dir * 86400000);
  }
  render();
}

document.getElementById('prevBtn').onclick = () => navStep(-1);
document.getElementById('nextBtn').onclick = () => navStep(1);

document.getElementById('todayBtn').onclick = () => {
  currentDate = new Date();
  render();
};

// ===== HEADER TITLE =====
function updateHeader() {
  const el = document.getElementById('headerTitle');
  const showNav = currentView !== 'todo';
  ['prevBtn','nextBtn','todayBtn'].forEach(id => {
    document.getElementById(id).style.visibility = showNav ? '' : 'hidden';
  });

  if (currentView === 'month') {
    el.textContent = `${currentDate.getFullYear()}년 ${MONTHS[currentDate.getMonth()]}`;
  } else if (currentView === 'week') {
    const ws = weekStart(currentDate);
    const we = new Date(ws.getTime() + 6*86400000);
    if (ws.getMonth() === we.getMonth()) {
      el.textContent = `${ws.getFullYear()}년 ${MONTHS[ws.getMonth()]} ${ws.getDate()}~${we.getDate()}일`;
    } else {
      el.textContent = `${MONTHS[ws.getMonth()]} ${ws.getDate()} ~ ${MONTHS[we.getMonth()]} ${we.getDate()}`;
    }
  } else if (currentView === 'day') {
    el.textContent = formatDate(ymd(currentDate));
  } else if (currentView === 'habit') {
    el.textContent = `${currentDate.getFullYear()}년 ${MONTHS[currentDate.getMonth()]} 습관`;
  } else if (currentView === 'stats') {
    if (statsPeriod === 'week') {
      const ws = weekStart(currentDate);
      const we = new Date(ws.getTime() + 6 * 86400000);
      el.textContent = `${ws.getMonth()+1}/${ws.getDate()} ~ ${we.getMonth()+1}/${we.getDate()} 주간 통계`;
    } else if (statsPeriod === 'year') {
      el.textContent = `${currentDate.getFullYear()}년 통계`;
    } else {
      el.textContent = `${currentDate.getFullYear()}년 ${MONTHS[currentDate.getMonth()]} 통계`;
    }
  } else {
    el.textContent = '할 일 목록';
  }
}

// ===== RENDER =====
function render() {
  updateHeader();
  if (currentView === 'month') renderMonth();
  else if (currentView === 'week') renderWeek();
  else if (currentView === 'day') renderDay();
  else if (currentView === 'habit') renderHabit();
  else if (currentView === 'stats') renderStats();
  else renderTodo();
  renderSidebar();
  renderWidget();
}

// ===== SIDEBAR: CLOCK =====
let lastClockDay = todayStr();

function updateClock() {
  const now = new Date();
  document.getElementById('scDate').textContent =
    `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${WEEKDAYS[now.getDay()]})`;
  document.getElementById('scTime').textContent =
    `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;

  // past midnight: reschedule notifications and refresh "today" highlights
  const nowDs = ymd(now);
  if (nowDs !== lastClockDay) {
    lastClockDay = nowDs;
    scheduleNotifs();
    render();
  }

  recordTick();
  updateRecBar();

  if (pipWin) {
    const c = pipWin.document.getElementById('wClock');
    if (c) c.textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
    const el = pipWin.document.getElementById('wElapsed');
    if (el && recording) el.textContent = fmtElapsed(Date.now() - recording.startedAt);
  }
}

// ===== SIDEBAR: D-DAY LIST =====
function nextOccurrence(ev, fromStr) {
  if (!ev.date) return null;
  // 기간 일정·일반 일정: D-day는 종료일(없으면 시작일) 기준
  if (!ev.repeat || ev.repeat === 'none') {
    const end = ev.endDate || ev.date;
    return end >= fromStr ? end : null;
  }
  if (ev.date >= fromStr) return ev.date;

  const fromD = new Date(fromStr + 'T00:00:00');
  for (let i = 0; i < 730; i++) {
    const ds = ymd(new Date(fromD.getTime() + i*86400000));
    if (ev.repeatEnd && ds > ev.repeatEnd) return null;
    if (evMatchesDate(ev, ds)) return ds;
  }
  return null;
}

function renderSidebar() {
  const today = todayStr();
  const todayD = new Date(today + 'T00:00:00');

  const items = events
    .filter(ev => ev.date && !ev.scope)
    .map(ev => ({ ev, occ: nextOccurrence(ev, today) }))
    .filter(x => x.occ && !(x.ev.isTodo && isTodoDone(x.ev, x.occ)))
    .sort((a, b) => a.occ.localeCompare(b.occ) || prioRank(a.ev) - prioRank(b.ev) || (a.ev.time || '').localeCompare(b.ev.time || ''));

  const list = document.getElementById('ddayList');
  if (!items.length) {
    list.innerHTML = `<div class="sidebar-empty">표시할 일정이 없습니다</div>`;
    renderScopeTodos(); // scoped section must render even when D-day is empty
    return;
  }

  list.innerHTML = '';
  items.forEach(({ ev, occ }) => {
    const occD = new Date(occ + 'T00:00:00');
    const diff = Math.round((occD - todayD) / 86400000);
    const badgeText = diff === 0 ? 'D-DAY' : `D-${diff}`;

    const row = document.createElement('div');
    row.className = 'dday-item';
    row.innerHTML = `
      <div class="dday-accent" style="background:${ev.color || COLORS[0]}"></div>
      <div class="dday-content">
        <div class="dday-title">${PRIORITY_ICON[ev.priority || 'normal']} ${escHtml(ev.title)}</div>
        <div class="dday-date">${ev.endDate && (!ev.repeat || ev.repeat === 'none')
          ? `${formatDate(ev.date)} ~ ${formatDate(ev.endDate)}`
          : formatDate(occ) + (ev.time ? ' · ' + formatTime(ev.time) : '')}</div>
      </div>
      <div class="dday-badge${diff === 0 ? ' today' : ''}">${badgeText}</div>
    `;
    row.onclick = () => openEdit(ev);
    list.appendChild(row);
  });

  renderScopeTodos();
}

// ===== SIDEBAR: MONTH/WEEK SCOPED TODOS =====
function renderScopeTodos() {
  const titleEl = document.getElementById('scopeTitle');
  const listEl = document.getElementById('scopeList');
  let scope = null;

  if (currentView === 'month' || currentView === 'habit') scope = 'month';
  else if (currentView === 'week') scope = 'week';

  document.querySelector('.sidebar').classList.toggle('has-scope', !!scope);

  if (!scope) {
    titleEl.style.display = 'none';
    listEl.style.display = 'none';
    return;
  }

  const yr = currentDate.getFullYear(), mo = currentDate.getMonth();
  const monthKey = `${yr}-${pad2(mo + 1)}`;
  const wsKey = ymd(weekStart(currentDate));

  const items = events.filter(ev => {
    if (!ev.isTodo || ev.scope !== scope || !ev.date) return false;
    if (scope === 'month') return ev.date.slice(0, 7) === monthKey;
    return ymd(weekStart(new Date(ev.date + 'T00:00:00'))) === wsKey;
  }).sort((a, b) => {
    const t = todayStr();
    return (isTodoDone(a, t)?1:0) - (isTodoDone(b, t)?1:0) || prioRank(a) - prioRank(b);
  });

  titleEl.style.display = 'flex';
  listEl.style.display = '';
  document.getElementById('scopeTitleText').textContent =
    scope === 'month' ? `🗓 ${mo + 1}월 할일` : '📆 이번 주 할일';

  listEl.innerHTML = '';
  if (!items.length) {
    // no early return: the carry-over button below must still render
    listEl.innerHTML = `<div class="scope-empty">${scope === 'month' ? '이 달' : '이 주'}의 할일이 없습니다. ＋로 추가해보세요.</div>`;
  }
  const t = todayStr();
  items.forEach(ev => {
    const done = isTodoDone(ev, t);
    const c = ev.color || COLORS[0];
    const row = document.createElement('div');
    row.className = 'dday-item';
    row.innerHTML = `
      <div class="pt-circle" style="border-color:${c}${done ? `;background:${c};color:white` : ''}">✓</div>
      <div class="dday-content">
        <div class="dday-title" style="${done ? 'text-decoration:line-through;color:var(--text2)' : ''}">${PRIORITY_ICON[ev.priority || 'normal']} ${escHtml(ev.title)}</div>
      </div>`;
    row.querySelector('.pt-circle').onclick = e => {
      e.stopPropagation();
      setTodoDone(ev, t, !done);
      saveEvents();
      render();
    };
    row.onclick = () => openEdit(ev);
    listEl.appendChild(row);
  });

  // offer to carry over unfinished items from the previous month/week
  const prevItems = events.filter(ev => {
    if (!ev.isTodo || ev.scope !== scope || !ev.date) return false;
    if (isTodoDone(ev, t)) return false;
    if (scope === 'month') {
      const pm = new Date(yr, mo - 1, 1);
      return ev.date.slice(0, 7) === `${pm.getFullYear()}-${pad2(pm.getMonth() + 1)}`;
    }
    const pws = ymd(new Date(weekStart(currentDate).getTime() - 7 * 86400000));
    return ymd(weekStart(new Date(ev.date + 'T00:00:00'))) === pws;
  });
  if (prevItems.length) {
    const btn = document.createElement('button');
    btn.className = 'carry-btn';
    btn.textContent = `↪ 지난${scope === 'month' ? '달' : '주'} 미완료 ${prevItems.length}개 이월하기`;
    btn.onclick = () => {
      const anchor = scope === 'month' ? `${yr}-${pad2(mo + 1)}-01` : wsKey;
      prevItems.forEach(ev => { ev.date = anchor; });
      saveEvents();
      render();
      showToast(`${prevItems.length}개 할일을 이월했습니다 ↪`);
    };
    listEl.appendChild(btn);
  }
}

document.getElementById('scopeAddBtn').onclick = () => {
  const scope = currentView === 'week' ? 'week' : 'month';
  const anchor = scope === 'week' ? ymd(weekStart(currentDate)) : ymd(currentDate);
  openAdd(anchor, '', true);
  document.getElementById('evScope').value = scope;
  updateScopeFields();
};

// ===== MONTH =====
function renderMonth() {
  const yr = currentDate.getFullYear(), mo = currentDate.getMonth();
  const first = new Date(yr, mo, 1);
  const start = new Date(yr, mo, 1 - first.getDay());
  const today = todayStr();
  const grid = document.getElementById('monthGrid');
  grid.innerHTML = '';

  const isRanged = ev => ev.endDate && (!ev.repeat || ev.repeat === 'none') && !ev.scope;

  for (let w = 0; w < 6; w++) {
    const row = document.createElement('div');
    row.className = 'month-week';

    // multi-day events overlapping this week → continuous bars in stacked lanes
    const wkDates = Array.from({ length: 7 }, (_, i) =>
      ymd(new Date(start.getTime() + (w * 7 + i) * 86400000)));
    const spans = events
      .filter(ev => isRanged(ev) && ev.date <= wkDates[6] && ev.endDate >= wkDates[0])
      .sort((a, b) => a.date.localeCompare(b.date) || b.endDate.localeCompare(a.endDate));
    const laneEnds = [];
    const placed = [];
    spans.forEach(ev => {
      let lane = laneEnds.findIndex(end => end < ev.date);
      if (lane === -1) lane = laneEnds.length;
      if (lane >= 3) return; // too many overlaps: this one stays as day chips
      laneEnds[lane] = ev.endDate;
      placed.push({ ev, lane });
    });
    const placedIds = new Set(placed.map(p => p.ev.id));
    const laneCount = placed.length ? Math.max(...placed.map(p => p.lane)) + 1 : 0;

    for (let d = 0; d < 7; d++) {
      const dt = new Date(start.getTime() + (w*7+d)*86400000);
      const ds = ymd(dt);
      const dayEvs = getEventsForDate(ds);
      const chipEvs = dayEvs.filter(ev => !placedIds.has(ev.id)); // bars are drawn once per week
      const isOther = dt.getMonth() !== mo;
      const isTdy = ds === today;
      const isSun = d === 0, isSat = d === 6;

      const cell = document.createElement('div');
      cell.className = 'month-day' +
        (isOther ? ' other-month' : '') +
        (isTdy ? ' today' : '') +
        (isSun ? ' sun' : '') +
        (isSat ? ' sat' : '');

      const topRow = document.createElement('div');
      topRow.className = 'day-top';
      const numEl = document.createElement('div');
      numEl.className = 'day-num';
      numEl.textContent = dt.getDate();
      topRow.appendChild(numEl);
      if (!isOther) {
        const hp = habitProgress(ds);
        if (hp && hp.done > 0) {
          const el = document.createElement('span');
          el.className = 'day-pct hb';
          el.textContent = hp.pct + '%';
          el.title = `습관 ${hp.done}/${hp.total}`;
          topRow.appendChild(el);
        }
        const tp = todoProgress(ds);
        if (tp && tp.done > 0) {
          const el = document.createElement('span');
          el.className = 'day-pct';
          el.textContent = tp.pct + '%';
          el.title = `할일 ${tp.done}/${tp.total}`;
          topRow.appendChild(el);
        }
      }
      cell.appendChild(topRow);

      const evBox = document.createElement('div');
      evBox.className = 'day-events';
      if (laneCount) evBox.style.marginTop = (laneCount * 17) + 'px'; // leave room for span bars
      const max = 3;
      chipEvs.slice(0, max).forEach(ev => {
        const chip = document.createElement('div');
        chip.className = 'event-chip' + (ev.isTodo && isTodoDone(ev, ds) ? ' completed' : '');
        chip.style.background = ev.color || COLORS[0];
        chip.textContent = evPrefix(ev, ds) + (ev.time ? ev.time.slice(0,5)+' ' : '') + ev.title;
        chip.onclick = e => { e.stopPropagation(); openEdit(ev); };
        evBox.appendChild(chip);
      });
      if (chipEvs.length > max) {
        const more = document.createElement('div');
        more.className = 'more-events';
        more.textContent = `+${chipEvs.length - max}개`;
        evBox.appendChild(more);
      }
      cell.appendChild(evBox);

      cell.onclick = () => openDayModal(ds, dayEvs);
      row.appendChild(cell);
    }

    // draw the continuous bars over this week row
    placed.forEach(({ ev, lane }) => {
      const sIdx = ev.date <= wkDates[0] ? 0 : wkDates.indexOf(ev.date);
      const eIdx = ev.endDate >= wkDates[6] ? 6 : wkDates.indexOf(ev.endDate);
      const realStart = ev.date >= wkDates[0];
      const realEnd = ev.endDate <= wkDates[6];
      const bar = document.createElement('div');
      bar.className = 'span-bar' +
        (realStart ? ' s-start' : '') +
        (realEnd ? ' s-end' : '') +
        (ev.isTodo && ev.completed ? ' completed' : '');
      bar.style.left = `calc(${(sIdx / 7) * 100}% + 2px)`;
      bar.style.width = `calc(${((eIdx - sIdx + 1) / 7) * 100}% - 4px)`;
      bar.style.top = (26 + lane * 17) + 'px';
      bar.style.background = ev.color || COLORS[0];
      bar.textContent = (ev.isTodo ? (ev.completed ? '✅ ' : '☐ ') : '') + ev.title;
      bar.title = `${ev.title} · ${formatDate(ev.date)} ~ ${formatDate(ev.endDate)}`;
      bar.onclick = e => { e.stopPropagation(); openEdit(ev); };
      row.appendChild(bar);
    });

    grid.appendChild(row);
  }
}

// ===== WEEK =====
function weekStart(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay());
}

function renderWeek() {
  const ws = weekStart(currentDate);
  const today = todayStr();

  // Header
  const header = document.getElementById('weekHeader');
  header.innerHTML = '<div></div>';
  for (let i = 0; i < 7; i++) {
    const dt = new Date(ws.getTime() + i*86400000);
    const ds = ymd(dt);
    const div = document.createElement('div');
    div.className = 'week-day-header' +
      (ds === today ? ' today' : '') +
      (i===0 ? ' wk-sun' : i===6 ? ' wk-sat' : '');
    div.innerHTML = `<div class="week-day-name">${WEEKDAYS[i]}</div><div class="week-day-num">${dt.getDate()}</div>`;
    header.appendChild(div);
  }

  renderWeekHabits(ws);

  // Collect events per day (only timed events)
  const dayEvs = Array.from({length:7}, (_,i) => {
    const dt = new Date(ws.getTime() + i*86400000);
    return getEventsForDate(ymd(dt)).filter(ev => ev.time);
  });

  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';

  for (let hr = 0; hr < 24; hr++) {
    const lbl = document.createElement('div');
    lbl.className = 'time-label';
    lbl.textContent = hr === 0 ? '' : `${hr}:00`;
    grid.appendChild(lbl);

    for (let day = 0; day < 7; day++) {
      const dt = new Date(ws.getTime() + day*86400000);
      const ds = ymd(dt);
      const cell = document.createElement('div');
      cell.className = 'week-cell' + (ds === today ? ' today-col' : '');
      const timeStr = `${pad2(hr)}:00`;
      cell.onclick = () => openAdd(ds, timeStr);

      // Place events
      dayEvs[day].forEach(ev => {
        const evHr = parseInt(ev.time.split(':')[0]);
        if (evHr !== hr) return;
        const evMin = parseInt(ev.time.split(':')[1]);

        let durH = 1;
        if (ev.endTime) {
          const [eh, em] = ev.endTime.split(':').map(Number);
          const startMin = evHr*60 + evMin;
          const endMin = eh*60 + em;
          durH = Math.max(0.4, (endMin - startMin) / 60);
        }

        const evEl = document.createElement('div');
        evEl.className = 'week-event' + (ev.isTodo && isTodoDone(ev, ds) ? ' completed' : '');
        evEl.style.background = ev.color || COLORS[0];
        evEl.style.top = `${(evMin/60)*52}px`;
        evEl.style.height = `${durH*52 - 2}px`;
        evEl.innerHTML = `<strong>${ev.time.slice(0,5)}</strong> ${evPrefix(ev, ds)}${escHtml(ev.title)}`;
        evEl.onclick = e => { e.stopPropagation(); openEdit(ev); };
        cell.appendChild(evEl);
      });

      grid.appendChild(cell);
    }
  }

  // Scroll to current hour
  const now = new Date();
  document.getElementById('weekScroll').scrollTop = Math.max(0, now.getHours()*52 - 80);
}

// ===== DAY VIEW (10-min time blocks) =====
function getDayTaskList(ds) {
  const ids = dayTasks[ds] || [];
  // Only todos: schedule-type events stay in month/week views and the D-day panel
  return events
    .filter(ev => ev.isTodo && ((!ev.scope && evMatchesDate(ev, ds)) || ids.includes(ev.id)))
    .sort((a, b) =>
      (isTodoDone(a, ds)?1:0) - (isTodoDone(b, ds)?1:0) ||
      prioRank(a) - prioRank(b) ||
      (a.time||'').localeCompare(b.time||''));
}

function paintedMinutes(ds, id) {
  return (timeLog[ds] || {})[id] || 0;
}

function renderPlannerTodo() {
  const ds = ymd(currentDate);
  const wrap = document.getElementById('plannerTodo');
  wrap.innerHTML = '';
  const list = getDayTaskList(ds);

  if (!list.length) {
    wrap.innerHTML = '<div class="pt-empty">할일이 없습니다. "＋ 가져오기"로 불러오거나 + 버튼으로 추가하세요.</div>';
  }

  // group by category (tree order), uncategorized last
  const groups = new Map();
  list.forEach(ev => {
    const cid = (ev.categoryId && catById(ev.categoryId)) ? ev.categoryId : '';
    if (!groups.has(cid)) groups.set(cid, []);
    groups.get(cid).push(ev);
  });
  const orderedKeys = [];
  const walkCats = pid => catChildren(pid).forEach(c => {
    if (groups.has(c.id)) orderedKeys.push(c.id);
    walkCats(c.id);
  });
  walkCats(null);
  if (groups.has('')) orderedKeys.push('');
  const showHeaders = orderedKeys.length > 1 || (orderedKeys.length === 1 && orderedKeys[0] !== '');

  orderedKeys.forEach(cid => {
    if (showHeaders) {
      const gh = document.createElement('div');
      gh.className = 'pt-group';
      gh.innerHTML = cid
        ? `<span class="pc-dot" style="width:8px;height:8px;background:${catById(cid).color}"></span>${escHtml(catPath(cid))}`
        : '미분류';
      wrap.appendChild(gh);
    }

    groups.get(cid).forEach(ev => {
    const c = ev.color || COLORS[0];
    const done = isTodoDone(ev, ds);
    const isRec = recording && recording.id === ev.id;
    const row = document.createElement('div');
    row.className = 'pt-item' +
      (paintTaskId === ev.id ? ' selected' : '') +
      (done ? ' done' : '') +
      (isRec ? ' rec-active' : '');
    const min = paintedMinutes(ds, ev.id);
    row.innerHTML = `
      <div class="pt-circle" style="border-color:${c}${done ? `;background:${c}` : ''}">✓</div>
      <div class="pt-title">${escHtml(ev.title)}</div>
      ${min ? `<span class="pt-min">${min}분</span>` : ''}
      ${isRec ? '<span class="pt-rec">⏺</span>' : ''}
      ${paintTaskId === ev.id ? '<span class="pt-brush">🖌️</span>' : ''}
      <button class="pt-edit" title="수정">✎</button>`;
    row.querySelector('.pt-circle').onclick = e => {
      e.stopPropagation();
      setTodoDone(ev, ds, !done);
      saveEvents();
      render();
    };
    row.querySelector('.pt-edit').onclick = e => { e.stopPropagation(); openEdit(ev); };
    // 열품타 style: clicking a row starts (or stops) its timer right away
    row.onclick = () => {
      if (isRec) {
        stopRecording();
        paintTaskId = null;
        showToast('타이머를 중지했습니다 ■');
      } else {
        paintTaskId = ev.id;
        startRecording(ev.id);
        showToast(`⏱️ "${ev.title}" 타이머 시작 — 10분 블록에 자동 기록됩니다`);
      }
      renderPlannerTodo();
      renderPlannerHabits();
    };
    wrap.appendChild(row);
    });
  });

  document.getElementById('eraserBtn').classList.toggle('selected', paintTaskId === 'ERASE');
  document.getElementById('dayGrid').classList.toggle('paint-mode', !!paintTaskId);
}

document.getElementById('pickTaskBtn').onclick = () => openPicker(ymd(currentDate));
document.getElementById('dayNewTaskBtn').onclick = () => openAdd(ymd(currentDate), '', true);
document.getElementById('eraserBtn').onclick = () => {
  paintTaskId = paintTaskId === 'ERASE' ? null : 'ERASE';
  renderPlannerTodo();

};

// ===== HABIT TRACKER =====
function toggleHabit(id, ds) {
  if (!habitChecks[ds]) habitChecks[ds] = [];
  const i = habitChecks[ds].indexOf(id);
  if (i >= 0) habitChecks[ds].splice(i, 1);
  else habitChecks[ds].push(id);
  if (!habitChecks[ds].length) delete habitChecks[ds];
  saveEvents();
}

function renderPlannerHabits() {
  const ds = ymd(currentDate);
  const wrap = document.getElementById('plannerHabits');
  wrap.innerHTML = '';
  if (!habits.length) {
    wrap.innerHTML = '<div class="pt-empty">습관이 없습니다. "＋ 추가"로 만들어보세요.</div>';
    return;
  }
  habits.forEach(hb => {
    const checked = (habitChecks[ds] || []).includes(hb.id);
    const isRec = recording && recording.id === hb.id;
    const row = document.createElement('div');
    row.className = 'pt-item' +
      (paintTaskId === hb.id ? ' selected' : '') +
      (isRec ? ' rec-active' : '');
    const min = paintedMinutes(ds, hb.id);
    row.innerHTML = `
      <div class="pt-circle" style="border-color:${hb.color}${checked ? `;background:${hb.color};color:white` : ''}">✓</div>
      <div class="pt-title">${escHtml(hb.name)}</div>
      ${min ? `<span class="pt-min">${min}분</span>` : ''}
      ${isRec ? '<span class="pt-rec">⏺</span>' : ''}
      ${paintTaskId === hb.id ? '<span class="pt-brush">🖌️</span>' : ''}
      <button class="pt-edit" title="수정">✎</button>`;
    row.querySelector('.pt-circle').onclick = e => {
      e.stopPropagation();
      toggleHabit(hb.id, ds);
      renderDay(); // refresh checklist + DONE. percentage
    };
    row.querySelector('.pt-edit').onclick = e => { e.stopPropagation(); openHabitModal(hb); };
    // 열품타 style: clicking a row starts (or stops) its timer right away
    row.onclick = () => {
      if (isRec) {
        stopRecording();
        paintTaskId = null;
        showToast('타이머를 중지했습니다 ■');
      } else {
        paintTaskId = hb.id;
        startRecording(hb.id);
        showToast(`⏱️ "${hb.name}" 타이머 시작 — 10분 블록에 자동 기록됩니다`);
      }
      renderPlannerTodo();
      renderPlannerHabits();
    };
    wrap.appendChild(row);
  });
}

function renderHabit() {
  const yr = currentDate.getFullYear(), mo = currentDate.getMonth();
  const days = new Date(yr, mo + 1, 0).getDate();
  const today = todayStr();
  const wrap = document.getElementById('habitGrid');
  wrap.innerHTML = '';

  if (!habits.length) {
    wrap.innerHTML = '<div class="habit-empty">아직 습관이 없습니다.<br>"＋ 습관 추가"를 눌러 시작해보세요 🔥</div>';
    return;
  }

  const table = document.createElement('div');
  table.className = 'habit-table';
  table.style.gridTemplateColumns = `150px repeat(${days}, 26px)`;

  const corner = document.createElement('div');
  corner.className = 'hb-name';
  corner.style.cursor = 'default';
  table.appendChild(corner);
  for (let d = 1; d <= days; d++) {
    const ds = `${yr}-${pad2(mo + 1)}-${pad2(d)}`;
    const h = document.createElement('div');
    h.className = 'hb-head' + (ds === today ? ' today' : '');
    h.textContent = d;
    table.appendChild(h);
  }

  habits.forEach(hb => {
    let count = 0;
    for (let d = 1; d <= days; d++) {
      if ((habitChecks[`${yr}-${pad2(mo + 1)}-${pad2(d)}`] || []).includes(hb.id)) count++;
    }

    const pct = Math.round(count / days * 100);
    const name = document.createElement('div');
    name.className = 'hb-name';
    name.title = '클릭하여 수정';
    name.innerHTML = `
      <span class="pc-dot" style="background:${hb.color}"></span>
      <span class="hb-txt">${escHtml(hb.name)}</span>
      <span class="hb-count">${count}/${days} · <b style="color:${hb.color}">${pct}%</b></span>`;
    name.onclick = () => openHabitModal(hb);
    table.appendChild(name);

    for (let d = 1; d <= days; d++) {
      const ds = `${yr}-${pad2(mo + 1)}-${pad2(d)}`;
      const checked = (habitChecks[ds] || []).includes(hb.id);
      const cell = document.createElement('div');
      cell.className = 'hb-cell' + (ds === today ? ' today' : '');
      cell.textContent = '✓';
      if (checked) {
        cell.style.background = hb.color;
        cell.style.color = 'white';
      }
      cell.onclick = () => { toggleHabit(hb.id, ds); renderHabit(); };
      table.appendChild(cell);
    }
  });

  wrap.appendChild(table);
}

function setSleepField(field, value) {
  const ds = ymd(currentDate);
  if (!sleepLog[ds]) sleepLog[ds] = {};
  if (value) sleepLog[ds][field] = value;
  else delete sleepLog[ds][field];
  if (!Object.keys(sleepLog[ds]).length) delete sleepLog[ds];
  saveEvents();
  renderDay(); // redraw the red wake/sleep markers on the time plan
}

// 수면 시간 = 어제 취침 → 오늘 기상 (자정 넘김 처리)
function renderSleepDur() {
  const ds = ymd(currentDate);
  const el = document.getElementById('sleepDur');
  const wake = (sleepLog[ds] || {}).wake;
  const prevDs = ymd(new Date(new Date(ds + 'T00:00:00').getTime() - 86400000));
  const prevSleep = (sleepLog[prevDs] || {}).sleep;
  if (!wake || !prevSleep) { el.textContent = ''; return; }
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const dur = (toMin(wake) - toMin(prevSleep) + 1440) % 1440;
  el.textContent = `😴 ${fmtMinutes(dur)} 수면`;
  el.title = `어제 ${prevSleep} 취침 → 오늘 ${wake} 기상`;
}

function renderRating() {

// Downscale to max 1000px JPEG so photos fit in localStorage
function addMemoImage(file) {
  const ds = ymd(currentDate);
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const maxDim = 1000;
    const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    const dataUrl = cv.toDataURL('image/jpeg', 0.72);
    URL.revokeObjectURL(url);

    if (!dayImages[ds]) dayImages[ds] = [];
    dayImages[ds].push(dataUrl);
    saveImages();
    autoSyncToFile();
    renderMemoImages();
    showToast('사진이 추가되었습니다 ✓');
  };
  img.onerror = () => { URL.revokeObjectURL(url); showToast('이미지를 읽을 수 없습니다'); };
  img.src = url;
}

function renderMemoImages() {

// Time plan rows start at 5AM like a paper planner: 5..23, then 0..4
const DAY_HOURS = Array.from({ length: 24 }, (_, i) => (i + 5) % 24);

function renderDay() {
  const ds = ymd(currentDate);
  document.getElementById('plannerDate').textContent = formatDate(ds);
  document.getElementById('plannerGoal').value = dayGoals[ds] || '';
  document.getElementById('plannerMemo').value = dayMemos[ds] || '';
  const hp = habitProgress(ds);
  const tp = todoProgress(ds);
  const parts = [];
  if (tp) parts.push(`할일 ${tp.pct}% (${tp.done}/${tp.total})`);
  if (hp) parts.push(`습관 ${hp.pct}% (${hp.done}/${hp.total})`);
  document.getElementById('plannerPct').textContent = parts.length ? parts.join(' · ') : '-';
  document.getElementById('plannerBad').value = dayBad[ds] || '';
  document.getElementById('plannerWake').value = (sleepLog[ds] || {}).wake || '';
  document.getElementById('plannerSleep').value = (sleepLog[ds] || {}).sleep || '';
  renderSleepDur();
  renderRating();
  renderPlannerTodo();
  renderPlannerHabits();
  renderMemoImages();

  const totalMin = dayLogTotal(ds);
  document.getElementById('dayTotalTime').textContent =
    totalMin ? `총 ${fmtMinutes(totalMin)} 기록` : '';
  updateRecBar();

  // last-7-days mini sparkline (recorded minutes, current day rightmost)
  const spark = document.getElementById('plannerSpark');
  spark.innerHTML = '';
  const base = new Date(ds + 'T00:00:00');
  const week7 = Array.from({ length: 7 }, (_, i) =>
    ymd(new Date(base.getTime() - (6 - i) * 86400000)));
  const mins7 = week7.map(d => dayLogTotal(d));
  const max7 = Math.max(...mins7, 60);
  week7.forEach((d, i) => {
    const bar = document.createElement('i');
    bar.style.height = Math.max(2, Math.round(mins7[i] / max7 * 12)) + 'px';
    if (d === ds) bar.style.background = 'var(--danger)';
    else if (!mins7[i]) bar.style.opacity = '0.25';
    bar.title = `${d.slice(5).replace('-', '/')} · ${mins7[i] ? fmtMinutes(mins7[i]) : '기록 없음'}`;
    spark.appendChild(bar);
  });

  const sc = document.getElementById('plannerScroll');
  const prevScroll = sc.scrollTop;
  const grid = document.getElementById('dayGrid');
  grid.innerHTML = '';

  const map = blocks[ds] || {};
  const now = new Date();
  const isToday = ds === todayStr();
  const nowKey = `${pad2(now.getHours())}:${pad2(Math.floor(now.getMinutes()/10)*10)}`;
  let nowRow = null;

  DAY_HOURS.forEach(hr => {
    const row = document.createElement('div');
    row.className = 'tp-row';
    const lbl = document.createElement('div');
    lbl.className = 'tp-hour';
    lbl.textContent = hr % 12 === 0 ? 12 : hr % 12;
    row.appendChild(lbl);

    const rowIds = [];
    for (let m = 0; m < 60; m += 10) rowIds.push(map[`${pad2(hr)}:${pad2(m)}`]);

    for (let i = 0; i < 6; i++) {
      const key = `${pad2(hr)}:${pad2(i * 10)}`;
      const cell = document.createElement('div');
      cell.className = 'tb-cell' + (isToday && key === nowKey ? ' now-block' : '');
      cell.dataset.k = key;
      const id = rowIds[i];
      if (id) {
        const p = findPaintable(id);
        if (p) {
          // partial fill: recorded minutes inside this 10-min block (absent = full)
          const bm = (blockMin[ds] || {})[key];
          const min = bm == null ? 10 : bm;
          const fill = document.createElement('div');
          fill.className = 'tb-fill';
          fill.style.width = Math.max(8, min * 10) + '%';
          fill.style.background = p.color;
          cell.appendChild(fill);
          cell.title = `${key} · ${p.title}` + (min < 10 ? ` · ${min}분` : '');
          // Show the task/habit title at the start of each run of same-colored blocks
          if (i === 0 || rowIds[i - 1] !== id) {
            let run = 1;
            while (i + run < 6 && rowIds[i + run] === id) run++;
            const lab = document.createElement('span');
            lab.className = 'tb-label';
            lab.style.width = `calc(${run * 100}% - 8px)`;
            lab.textContent = p.title;
            cell.appendChild(lab);
          }
        }
      }
      row.appendChild(cell);
    }
    if (isToday && hr === now.getHours()) nowRow = row;

    // red markers at the recorded wake/sleep times
    const sl = sleepLog[ds] || {};
    const addTimeMarker = (timeStr, icon, label) => {
      const [h, m] = timeStr.split(':').map(Number);
      if (h !== hr) return;
      const mk = document.createElement('div');
      mk.className = 'time-marker';
      mk.style.left = `calc(32px + (100% - 32px) * ${(m / 60).toFixed(4)})`;
      mk.title = `${label} ${timeStr}`;
      mk.innerHTML = `<span class="tm-icon">${icon}</span>`;
      row.appendChild(mk);
    };
    if (sl.wake) addTimeMarker(sl.wake, '☀️', '기상');
    if (sl.sleep) addTimeMarker(sl.sleep, '🌙', '취침');

    grid.appendChild(row);
  });

  if (dayRenderedFor === ds) {
    sc.scrollTop = prevScroll;
  } else if (nowRow) {
    nowRow.scrollIntoView({ block: 'center' });
  } else {
    sc.scrollTop = 0;
  }
  dayRenderedFor = ds;
}

// Painting (click or drag over cells)
let painting = false, paintErase = false;

let paintActiveCell = null; // cell currently under the pointer during a drag
let paintAdjustCell = null; // set when the drag started on an own PARTIAL cell: slider mode locked to it

// pointer x → minutes (1..10), NaN-safe
function minutesFromX(cell, clientX) {
  const r = cell.getBoundingClientRect();
  let ratio = r.width ? (clientX - r.left) / r.width : 1;
  ratio = Math.max(0, Math.min(1, ratio));
  const m = Math.ceil(ratio * 10);
  return Math.max(1, Math.min(10, Number.isFinite(m) ? m : 10));
}

function setCellMinutes(cell, minutes, p) {
  const ds = ymd(currentDate);
  const key = cell.dataset.k;
  if (!blocks[ds]) blocks[ds] = {};
  if (!blockMin[ds]) blockMin[ds] = {};
  const map = blocks[ds];
  const bmDay = blockMin[ds];
  const prevMin = bmDay[key] == null ? (key in map ? 10 : 0) : bmDay[key];

  if (map[key] !== paintTaskId) {
    if (map[key]) addLog(ds, map[key], -prevMin); // repaint over another task
    map[key] = paintTaskId;
    addLog(ds, paintTaskId, minutes);
  } else if (minutes !== prevMin) {
    addLog(ds, paintTaskId, minutes - prevMin);
  }
  bmDay[key] = minutes;
  cell.innerHTML = `<div class="tb-fill" style="width:${Math.max(8, minutes * 10)}%;background:${p.color}"></div>`;
  cell.title = `${key} · ${p.title}` + (minutes < 10 ? ` · ${minutes}분` : '');
}

function applyPaint(cell, clientX) {
  const ds = ymd(currentDate);
  const key = cell.dataset.k;
  if (!blocks[ds]) blocks[ds] = {};
  if (!blockMin[ds]) blockMin[ds] = {};
  const map = blocks[ds];
  const bmDay = blockMin[ds];
  const minOf = k => bmDay[k] == null ? 10 : bmDay[k];

  if (paintErase) {
    if (key in map) {
      addLog(ds, map[key], -minOf(key)); // remove only what was actually logged
      delete map[key];
      delete bmDay[key];
      cell.innerHTML = '';
      cell.removeAttribute('title');
    }
  } else {
    const p = findPaintable(paintTaskId);
    if (!p) return;

    // slider mode: the drag started on an own partial cell → only adjust that cell
    if (paintAdjustCell) {
      setCellMinutes(paintAdjustCell, minutesFromX(paintAdjustCell, clientX), p);
      return;
    }

    // leaving a cell mid-drag fills it up completely
    if (paintActiveCell && paintActiveCell !== cell) {
      const prevKey = paintActiveCell.dataset.k;
      if (map[prevKey] === paintTaskId && minOf(prevKey) < 10) {
        setCellMinutes(paintActiveCell, 10, p);
      }
    }
    paintActiveCell = cell;

    // fill up to the pointer position, snapped to 1-min (10%) steps
    setCellMinutes(cell, clientX == null ? 10 : minutesFromX(cell, clientX), p);
  }
  if (blockMin[ds] && !Object.keys(blockMin[ds]).length) delete blockMin[ds];
}

const dayGridEl = document.getElementById('dayGrid');

dayGridEl.addEventListener('pointerdown', e => {
  const cell = e.target.closest('.tb-cell');
  if (!cell) return;
  if (!paintTaskId) {
    showToast('TO DO LIST에서 할일이나 지우개를 먼저 선택하세요');
    return;
  }
  e.preventDefault();
  const ds = ymd(currentDate);
  const key = cell.dataset.k;
  const owned = blocks[ds] && blocks[ds][key] === paintTaskId;
  const ownedFull = owned &&
    ((blockMin[ds] || {})[key] == null || blockMin[ds][key] >= 10);
  // clicking your own FULL block erases; your own PARTIAL block becomes a
  // slider locked to that cell (dragging can't spill into neighbours)
  paintErase = paintTaskId === 'ERASE' || ownedFull;
  paintAdjustCell = (!paintErase && owned) ? cell : null;
  painting = true;
  paintActiveCell = null;
  applyPaint(cell, e.clientX);
});

dayGridEl.addEventListener('pointermove', e => {
  if (!painting) return;
  e.preventDefault();
  if (paintAdjustCell) { applyPaint(paintAdjustCell, e.clientX); return; }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const cell = el && el.closest ? el.closest('.tb-cell') : null;
  if (cell) applyPaint(cell, e.clientX);
});

window.addEventListener('pointerup', () => {
  if (!painting) return;
  painting = false;
  paintActiveCell = null;
  paintAdjustCell = null;
  saveEvents();
  renderDay(); // refresh block labels + minute totals (scroll position is preserved)
});

// ===== TASK PICKER (pull any task into this day) =====
function openPicker(ds) {
  document.getElementById('pickerTitle').textContent = formatDate(ds) + ' · 할일 가져오기';
  const list = document.getElementById('pickerList');

  const sorted = events
    .filter(ev => ev.isTodo)
    .sort((a, b) =>
      (isTodoDone(a, ds)?1:0) - (isTodoDone(b, ds)?1:0) ||
      prioRank(a) - prioRank(b));

  if (!sorted.length) {
    list.innerHTML = '<div style="text-align:center;color:var(--text2);padding:20px 0">등록된 할일이 없습니다.<br>+ 버튼으로 먼저 추가해보세요</div>';
  }

  sorted.forEach(ev => {
    const auto = !ev.scope && evMatchesDate(ev, ds);
    const picked = (dayTasks[ds] || []).includes(ev.id);
    const metaTxt = auto ? '이 날의 할일 (자동 표시됨)'
      : ev.scope === 'month' ? '🗓 월간 할일'
      : ev.scope === 'week' ? '📆 주간 할일'
      : ev.date ? formatDate(ev.date) : '날짜 없음';
    const row = document.createElement('div');
    row.className = 'picker-row' + (auto || picked ? ' checked' : '') + (auto ? ' auto' : '');
    row.innerHTML = `
      <div class="picker-check">✓</div>
      <div class="day-event-accent" style="background:${ev.color || COLORS[0]}"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600${isTodoDone(ev, ds) ? ';text-decoration:line-through;opacity:0.6' : ''}">${escHtml(ev.title)}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:2px">${metaTxt}</div>
      </div>`;
    if (!auto) {
      row.onclick = () => {
        if (!dayTasks[ds]) dayTasks[ds] = [];
        const i = dayTasks[ds].indexOf(ev.id);
        if (i >= 0) dayTasks[ds].splice(i, 1);
        else dayTasks[ds].push(ev.id);
        if (!dayTasks[ds].length) delete dayTasks[ds];
        saveEvents();
        openPicker(ds);
      };
    }
    list.appendChild(row);
  });

  document.getElementById('pickerModal').classList.add('open');
}

}

document.getElementById('pickerCloseBtn').onclick = closePicker;
