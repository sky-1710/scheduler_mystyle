// Daily habit completion count
function habitCheckedCount(ds) {
  return (habitChecks[ds] || []).filter(id => habits.some(h => h.id === id)).length;
}

// Todos that belong to a given day (own date match or pulled in;
// scoped month/week todos only count when explicitly pulled in)
function dayTodoList(ds) {
  return events.filter(ev => ev.isTodo &&
    ((!ev.scope && evMatchesDate(ev, ds)) || (dayTasks[ds] || []).includes(ev.id)));
}

// Daily habit progress (null when no habits)
function habitProgress(ds) {
  if (!habits.length) return null;
  const done = habitCheckedCount(ds);
  return { pct: Math.round(done / habits.length * 100), done, total: habits.length };
}

// Daily todo progress (null when the day has no todos)
function todoProgress(ds) {
  const todos = dayTodoList(ds);
  if (!todos.length) return null;
  const done = todos.filter(t => isTodoDone(t, ds)).length;
  return { pct: Math.round(done / todos.length * 100), done, total: todos.length };
}

// ===== CATEGORIES (nested via parentId) =====
function catById(id) { return categories.find(c => c.id === id); }

function catChildren(pid) {
  return categories.filter(c => (c.parentId || null) === (pid || null));
}

function catPath(id) {
  const parts = [];
  let c = catById(id);
  let guard = 0;
  while (c && guard++ < 10) { parts.unshift(c.name); c = catById(c.parentId); }
  return parts.join(' > ');
}

// climb to the top-level ancestor of a category
function topCatOf(cid) {
  let c = catById(cid);
  let guard = 0;
  while (c && c.parentId && guard++ < 10) c = catById(c.parentId);
  return c ? c.id : null;
}

// true if `id` is `ancestorId` itself or nested anywhere under it
function isUnderCat(id, ancestorId) {
  let c = catById(id);
  let guard = 0;
  while (c && guard++ < 10) {
    if (c.id === ancestorId) return true;
    c = catById(c.parentId);
  }
  return false;
}

// Fill a <select> with the category tree, indented; excludeId hides that
// category and its descendants (so a category can't become its own parent)
function fillCategorySelect(sel, selected, excludeId, emptyLabel) {
  sel.innerHTML = `<option value="">${emptyLabel || '카테고리 없음'}</option>`;
  const addOpts = (pid, depth) => {
    catChildren(pid).forEach(c => {
      if (excludeId && isUnderCat(c.id, excludeId)) return;
      const o = document.createElement('option');
      o.value = c.id;
      o.textContent = '  '.repeat(depth) + (depth ? '└ ' : '') + c.name;
      sel.appendChild(o);
      addOpts(c.id, depth + 1);
    });
  };
  addOpts(null, 0);
  sel.value = (selected && catById(selected)) ? selected : '';
}

// ===== MINUTE LEDGER =====
// All time totals come from timeLog (1-minute precision).
// Manual painting adds/removes 10 min per block; the live timer adds 1 min per minute.
function addLog(ds, id, delta) {
  if (!Number.isFinite(delta) || delta === 0) return; // never corrupt the ledger
  if (!timeLog[ds]) timeLog[ds] = {};
  const v = (timeLog[ds][id] || 0) + delta;
  if (v > 0) timeLog[ds][id] = v;
  else delete timeLog[ds][id];
  if (!Object.keys(timeLog[ds]).length) delete timeLog[ds];
}

function dayLogTotal(ds) {
  return Object.values(timeLog[ds] || {}).reduce((a, b) => a + b, 0);
}

// one-time migration: derive the ledger from previously painted blocks
function rebuildTimeLogFromBlocks() {
  timeLog = {};
  for (const d in blocks) {
    for (const k in blocks[d]) addLog(d, blocks[d][k], 10);
  }
}

// A painted block can point to a task (event) or a habit
function findPaintable(id) {
  const ev = events.find(e => e.id === id);
  if (ev) return { title: ev.title, color: ev.color || COLORS[0] };
  const hb = habits.find(h => h.id === id);
  if (hb) return { title: hb.name, color: hb.color };
  return null;
}

// Per-day habit checklist cards above the week grid (Notion style)
function renderWeekHabits(ws) {
  const cont = document.getElementById('weekHabits');
  cont.innerHTML = '';
  if (!habits.length) { cont.style.display = 'none'; return; }
  cont.style.display = '';
  const today = todayStr();

  const corner = document.createElement('div');
  corner.className = 'wh-corner';
  corner.textContent = '습관';
  cont.appendChild(corner);

  for (let i = 0; i < 7; i++) {
    const ds = ymd(new Date(ws.getTime() + i * 86400000));
    const hp = habitProgress(ds);
    const tp = todoProgress(ds);

    const col = document.createElement('div');
    col.className = 'wh-day' + (ds === today ? ' today-col' : '');

    if (hp) {
      const row = document.createElement('div');
      row.className = 'wh-pct';
      row.title = `습관 ${hp.done}/${hp.total} 완료`;
      row.innerHTML = `<span style="color:#F59E0B">${hp.pct}%</span><span class="wh-bar hb"><div style="width:${hp.pct}%"></div></span>`;
      col.appendChild(row);
    }
    if (tp) {
      const row = document.createElement('div');
      row.className = 'wh-pct';
      row.title = `할일 ${tp.done}/${tp.total} 완료`;
      row.innerHTML = `<span style="color:var(--primary)">${tp.pct}%</span><span class="wh-bar"><div style="width:${tp.pct}%"></div></span>`;
      col.appendChild(row);
    }

    habits.forEach(hb => {
      const checked = (habitChecks[ds] || []).includes(hb.id);
      const item = document.createElement('div');
      item.className = 'wh-item' + (checked ? ' done' : '');
      item.innerHTML = `
        <span class="wh-check" style="border-color:${hb.color}${checked ? `;background:${hb.color}` : ''}">✓</span>
        <span class="wh-label">${escHtml(hb.name)}</span>`;
      item.onclick = () => { toggleHabit(hb.id, ds); renderWeekHabits(ws); };
      col.appendChild(item);
    });

    cont.appendChild(col);
  }
}

// ===== STATS =====
let statsPeriod = localStorage.getItem('statsPeriod') || 'month';
const NONE_COLOR = '#94A3B8';

function fmtMinutes(min) {
  const h = Math.floor(min / 60), m = min % 60;
  if (h && m) return `${h}시간 ${m}분`;
  if (h) return `${h}시간`;
  return `${m}분`;
}

function habitStreak(hb) {
  // consecutive checked days ending today (or yesterday if today unchecked yet)
  let streak = 0;
  let d = new Date();
  if (!(habitChecks[ymd(d)] || []).includes(hb.id)) d = new Date(d.getTime() - 86400000);
  while ((habitChecks[ymd(d)] || []).includes(hb.id)) {
    streak++;
    d = new Date(d.getTime() - 86400000);
  }
  return streak;
}

// ---- aggregation helpers (shared by week/month/year) ----
function datesRange(startD, n) {
  return Array.from({ length: n }, (_, i) => ymd(new Date(startD.getTime() + i * 86400000)));
}

function monthDatesOf(yr, mo) {
  const days = new Date(yr, mo + 1, 0).getDate();
  return Array.from({ length: days }, (_, i) => `${yr}-${pad2(mo + 1)}-${pad2(i + 1)}`);
}

function paintSource(id) {
  return events.find(e => e.id === id) || habits.find(h => h.id === id);
}

function blocksMinutes(dates) {
  const totals = {};
  let grand = 0;
  dates.forEach(ds => {
    const m = timeLog[ds] || {};
    for (const id in m) {
      totals[id] = (totals[id] || 0) + m[id];
      grand += m[id];
    }
  });
  return { totals, grand };
}

// minutes per top-level category for one date list entry
function topCatSegs(dates) {
  return dates.map(ds => {
    const m = timeLog[ds] || {};
    const seg = {};
    for (const id in m) {
      const src = paintSource(id);
      const cid = (src && src.categoryId && catById(src.categoryId)) ? topCatOf(src.categoryId) : 'none';
      seg[cid] = (seg[cid] || 0) + m[id];
    }
    return seg;
  });
}

function todoStatsFor(dates) {
  let total = 0, done = 0;
  dates.forEach(ds => dayTodoList(ds).forEach(t => {
    total++;
    if (isTodoDone(t, ds)) done++;
  }));
  return { total, done };
}

function habitAvgPct(dates) {
  if (!habits.length) return null;
  let sum = 0;
  habits.forEach(hb => {
    let c = 0;
    dates.forEach(ds => { if ((habitChecks[ds] || []).includes(hb.id)) c++; });
    sum += c / dates.length * 100;
  });
  return Math.round(sum / habits.length);
}

function deltaHtml(cur, prev, fmt, unitLabel) {
  const d = cur - prev;
  if (!d) return `<span style="color:var(--text2)">지난${unitLabel}과 동일</span>`;
  const up = d > 0;
  return `<span style="color:${up ? 'var(--success)' : 'var(--danger)'};font-weight:700">${up ? '▲' : '▼'} ${fmt(Math.abs(d))}</span> <span style="color:var(--text2)">지난${unitLabel} 대비</span>`;
}

// ---- section builders ----
function buildCards(defs) {
  const cards = document.createElement('div');
  cards.className = 'stat-cards';
  cards.innerHTML = defs.map(d => `
    <div class="stat-card">
      <div class="sc-label">${d.label}</div>
      <div class="sc-value">${d.value}</div>
      <div class="sc-sub">${d.sub || ''}</div>
    </div>`).join('');
  return cards;
}

// stacked columns colored by top-level category
// cols: [{ seg, label, tip, highlight }]
function buildStackedChart(cols) {
  const frag = document.createElement('div');
  const stackOrder = [...catChildren(null).map(c => c.id), 'none'];
  const usedCats = stackOrder.filter(id => cols.some(c => c.seg[id]));
  const catColor = id => id === 'none' ? NONE_COLOR : catById(id).color;
  const catName = id => id === 'none' ? '미분류' : catById(id).name;
  const maxV = Math.max(...cols.map(c => Object.values(c.seg).reduce((a, b) => a + b, 0)), 60);

  const chart = document.createElement('div');
  chart.className = 'chart-days';
  const xAxis = document.createElement('div');
  xAxis.className = 'chart-x';

  cols.forEach(c => {
    const col = document.createElement('div');
    col.className = 'cd-col' + (c.highlight ? ' today-col' : '');
    const total = Object.values(c.seg).reduce((a, b) => a + b, 0);
    const tipParts = usedCats.filter(id => c.seg[id]).map(id => `${catName(id)} ${fmtMinutes(c.seg[id])}`);
    col.title = c.tip + (total ? ` · 총 ${fmtMinutes(total)} · ${tipParts.join(' · ')}` : ' · 기록 없음');
    // append top→bottom so the first category sits at the bottom
    [...usedCats].reverse().forEach(id => {
      const min = c.seg[id];
      if (!min) return;
      const seg = document.createElement('div');
      seg.className = 'cd-seg';
      seg.style.height = Math.max(2, Math.round(min / maxV * 126)) + 'px';
      seg.style.background = catColor(id);
      col.appendChild(seg);
    });
    chart.appendChild(col);

    const lab = document.createElement('div');
    lab.className = 'cd-lab';
    lab.textContent = c.label;
    xAxis.appendChild(lab);
  });
  frag.appendChild(chart);
  frag.appendChild(xAxis);

  if (usedCats.length) {
    const legend = document.createElement('div');
    legend.className = 'chart-legend';
    usedCats.forEach(id => {
      const item = document.createElement('span');
      item.innerHTML = `<span class="pc-dot" style="width:8px;height:8px;background:${catColor(id)}"></span>${escHtml(catName(id))}`;
      legend.appendChild(item);
    });
    frag.appendChild(legend);
  }
  return frag;
}

// simple SVG line chart — points: [{ v: number|null, label, tip }] (null = gap)
function buildLineChart(points, opts) {
  const H = 120, P = 16, W = 700;
  const n = points.length;
  const vals = points.map(p => p.v).filter(v => v != null);
  const max = opts.max || Math.max(...vals, 1);
  const x = i => n === 1 ? W / 2 : P + i * ((W - 2 * P) / (n - 1));
  const y = v => H - P - (v / max) * (H - 2 * P - 10);
  let path = '';
  let pen = false;
  points.forEach((p, i) => {
    if (p.v == null) { pen = false; return; }
    path += (pen ? ' L' : ' M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1);
    pen = true;
  });
  const dots = points.map((p, i) => p.v == null ? '' :
    `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" fill="${opts.color}"><title>${escHtml(p.tip)}</title></circle>`).join('');
  const labels = points.map((p, i) => p.label ?
    `<text x="${x(i).toFixed(1)}" y="${H - 2}" font-size="9" text-anchor="middle" fill="var(--text2)">${escHtml(p.label)}</text>` : '').join('');
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <svg class="trend-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="${P}" y1="${H - P - 10}" x2="${W - P}" y2="${H - P - 10}" stroke="var(--border)" stroke-width="1"/>
      <text x="${P}" y="12" font-size="9" fill="var(--text2)">최대 ${escHtml(opts.maxLabel || String(max))}</text>
      <path d="${path.trim()}" fill="none" stroke="${opts.color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
      ${dots}${labels}
    </svg>`;
  return wrap.firstElementChild;
}

// 한눈에 보는 추이: 기록 시간 라인 + 하루 별점 라인
function buildTrendSection(cols) { // cols: [{ ds, label, tip }]
  const sec = document.createElement('div');
  sec.innerHTML = '<div class="p-section-title" style="margin:24px 0 2px">📉 추이 그래프</div>';

  const timePts = cols.map(c => {
    const v = dayLogTotal(c.ds);
    return { v, label: c.label, tip: `${c.tip} · ${fmtMinutes(v)}` };
  });
  const maxT = Math.max(...timePts.map(p => p.v), 60);
  const cap1 = document.createElement('div');
  cap1.className = 'trend-caption';
  cap1.textContent = '⏱ 기록 시간';
  sec.appendChild(cap1);
  sec.appendChild(buildLineChart(timePts, { max: maxT, color: 'var(--primary)', maxLabel: fmtMinutes(maxT) }));

  const ratePts = cols.map(c => ({
    v: dayRatings[c.ds] != null ? dayRatings[c.ds] : null,
    label: c.label,
    tip: `${c.tip} · ${dayRatings[c.ds] != null ? dayRatings[c.ds] + '점' : '평가 없음'}`,
  }));
  const cap2 = document.createElement('div');
  cap2.className = 'trend-caption';
  cap2.textContent = '⭐ 하루 별점 (10점 만점)';
  sec.appendChild(cap2);
  if (ratePts.some(p => p.v != null)) {
    sec.appendChild(buildLineChart(ratePts, { max: 10, color: '#F59E0B', maxLabel: '10점' }));
  } else {
    const e = document.createElement('div');
    e.className = 'stat-empty';
    e.textContent = "별점 기록이 없습니다. 일간 뷰의 TODAY'S REVIEW에서 평가해보세요.";
    sec.appendChild(e);
  }
  return sec;
}

function buildCatTimeSection(dates, emptyMsg) {
  const { totals } = blocksMinutes(dates);
  const timeItems = Object.entries(totals)
    .map(([id, min]) => ({ id, p: findPaintable(id), min }))
    .filter(x => x.p)
    .sort((a, b) => b.min - a.min);

  const catDirect = {};
  const uncategorized = [];
  timeItems.forEach(({ id, p, min }) => {
    const src = paintSource(id);
    const cid = src && src.categoryId && catById(src.categoryId) ? src.categoryId : null;
    if (cid) catDirect[cid] = (catDirect[cid] || 0) + min;
    else uncategorized.push({ p, min });
  });
  const catTotal = id => catChildren(id).reduce((s, ch) => s + catTotal(ch.id), catDirect[id] || 0);
  const topCatRows = catChildren(null)
    .map(c => ({ c, total: catTotal(c.id) }))
    .filter(x => x.total > 0)
    .sort((a, b) => b.total - a.total);
  const maxMin = Math.max(1, ...topCatRows.map(x => x.total), ...uncategorized.map(x => x.min));

  const sec = document.createElement('div');
  sec.innerHTML = '<div class="p-section-title" style="margin:24px 0 8px">⏱️ 카테고리별 기록 시간</div>';
  if (!timeItems.length) {
    sec.innerHTML += `<div class="stat-empty">${emptyMsg}</div>`;
    return sec;
  }
  const addCatRow = (c, total, depth) => {
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.style.paddingLeft = (depth * 20) + 'px';
    row.innerHTML = `
      <div class="sr-name"><span class="pc-dot" style="background:${c.color}"></span><span>${depth ? '└ ' : ''}${escHtml(c.name)}</span></div>
      <div class="sr-bar"><div style="width:${Math.round(total / maxMin * 100)}%;background:${c.color}"></div></div>
      <div class="sr-val">${fmtMinutes(total)}</div>`;
    sec.appendChild(row);
    catChildren(c.id)
      .map(ch => ({ ch, total: catTotal(ch.id) }))
      .filter(x => x.total > 0)
      .sort((a, b) => b.total - a.total)
      .forEach(x => addCatRow(x.ch, x.total, depth + 1));
  };
  topCatRows.forEach(x => addCatRow(x.c, x.total, 0));

  if (uncategorized.length) {
    if (topCatRows.length) {
      const div = document.createElement('div');
      div.className = 'p-section-title';
      div.style.cssText = 'margin:14px 0 4px;color:var(--text2)';
      div.textContent = '미분류';
      sec.appendChild(div);
    }
    uncategorized.forEach(({ p, min }) => {
      const row = document.createElement('div');
      row.className = 'stat-row';
      row.innerHTML = `
        <div class="sr-name"><span class="pc-dot" style="background:${p.color}"></span><span>${escHtml(p.title)}</span></div>
        <div class="sr-bar"><div style="width:${Math.round(min / maxMin * 100)}%;background:${p.color}"></div></div>
        <div class="sr-val">${fmtMinutes(min)}</div>`;
      sec.appendChild(row);
    });
  }
  return sec;
}

function buildSuccSection(dates, emptyMsg) {
  const succDirect = {};
  const succNone = { done: 0, total: 0 };
  const bump = (cid, done) => {
    const tgt = cid ? (succDirect[cid] = succDirect[cid] || { done: 0, total: 0 }) : succNone;
    tgt.total++;
    if (done) tgt.done++;
  };
  dates.forEach(ds => {
    dayTodoList(ds).forEach(t => {
      const cid = (t.categoryId && catById(t.categoryId)) ? t.categoryId : null;
      bump(cid, isTodoDone(t, ds));
    });
    habits.forEach(hb => {
      const cid = (hb.categoryId && catById(hb.categoryId)) ? hb.categoryId : null;
      bump(cid, (habitChecks[ds] || []).includes(hb.id));
    });
  });
  const succTotal = id => catChildren(id).reduce((s, ch) => {
    const t = succTotal(ch.id);
    return { done: s.done + t.done, total: s.total + t.total };
  }, { done: (succDirect[id] || {}).done || 0, total: (succDirect[id] || {}).total || 0 });

  const sec = document.createElement('div');
  sec.innerHTML = '<div class="p-section-title" style="margin:24px 0 8px">✅ 카테고리별 성공률</div>';
  const succRows = catChildren(null)
    .map(c => ({ c, t: succTotal(c.id) }))
    .filter(x => x.t.total > 0)
    .sort((a, b) => b.t.done / b.t.total - a.t.done / a.t.total);
  if (!succRows.length && !succNone.total) {
    sec.innerHTML += `<div class="stat-empty">${emptyMsg}</div>`;
    return sec;
  }
  const addSuccRow = (name, color, t, depth) => {
    const pct = Math.round(t.done / t.total * 100);
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.style.paddingLeft = (depth * 20) + 'px';
    row.innerHTML = `
      <div class="sr-name"><span class="pc-dot" style="background:${color}"></span><span>${depth ? '└ ' : ''}${escHtml(name)}</span></div>
      <div class="sr-bar"><div style="width:${pct}%;background:${color}"></div></div>
      <div class="sr-val">${t.done}/${t.total} · ${pct}%</div>`;
    sec.appendChild(row);
  };
  const walk = (c, depth) => {
    const t = succTotal(c.id);
    if (!t.total) return;
    addSuccRow(c.name, c.color, t, depth);
    catChildren(c.id).forEach(ch => walk(ch, depth + 1));
  };
  succRows.forEach(x => walk(x.c, 0));
  if (succNone.total) addSuccRow('미분류', NONE_COLOR, succNone, 0);
  return sec;
}

// returns a fn: categoryId -> minutes recorded in dates (children rolled up)
function catMinutesRollup(dates) {
  const { totals } = blocksMinutes(dates);
  const direct = {};
  for (const id in totals) {
    const src = paintSource(id);
    const cid = src && src.categoryId && catById(src.categoryId) ? src.categoryId : null;
    if (cid) direct[cid] = (direct[cid] || 0) + totals[id];
  }
  const roll = id => catChildren(id).reduce((s, ch) => s + roll(ch.id), direct[id] || 0);
  return roll;
}

// time goals per category (weeklyGoalH), scaled to the period length
function buildGoalSection(dates, title) {
  const goals = categories.filter(c => c.weeklyGoalH > 0);
  if (!goals.length) return null;
  const roll = catMinutesRollup(dates);
  const scale = dates.length / 7; // 1 for a week, ~4.4 for a month
  const sec = document.createElement('div');
  sec.innerHTML = `<div class="p-section-title" style="margin:24px 0 8px">${title}</div>`;
  goals.forEach(c => {
    const min = roll(c.id);
    const goalMin = Math.round(c.weeklyGoalH * 60 * scale);
    const pct = Math.round(min / goalMin * 100);
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML = `
      <div class="sr-name"><span class="pc-dot" style="background:${c.color}"></span><span>${escHtml(c.name)}</span></div>
      <div class="sr-bar"><div style="width:${Math.min(100, pct)}%;background:${c.color}"></div></div>
      <div class="sr-val">${fmtMinutes(min)} / ${fmtMinutes(goalMin)} · ${pct}%${pct >= 100 ? ' 🎉' : ''}</div>`;
    sec.appendChild(row);
  });
  return sec;
}

// streakMode: 'current' (ends today) or 'best' (longest within dates)
function buildHabitSection(dates, streakMode) {
  const sec = document.createElement('div');
  sec.innerHTML = '<div class="p-section-title" style="margin:24px 0 8px">🔥 습관 달성률 · 연속 기록</div>';
  if (!habits.length) {
    sec.innerHTML += '<div class="stat-empty">등록된 습관이 없습니다.</div>';
    return sec;
  }
  habits.map(hb => {
    let count = 0, cur = 0, best = 0;
    dates.forEach(ds => {
      if ((habitChecks[ds] || []).includes(hb.id)) { count++; cur++; best = Math.max(best, cur); }
      else cur = 0;
    });
    const streak = streakMode === 'best' ? best : habitStreak(hb);
    return { hb, count, pct: Math.round(count / dates.length * 100), streak };
  }).sort((a, b) => b.count - a.count).forEach(({ hb, count, pct, streak }) => {
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML = `
      <div class="sr-name"><span class="pc-dot" style="background:${hb.color}"></span><span>${escHtml(hb.name)}</span></div>
      <div class="sr-bar"><div style="width:${pct}%;background:${hb.color}"></div></div>
      <div class="sr-val">${count}/${dates.length} · ${pct}%${streak ? ` · 🔥${streak}일${streakMode === 'best' ? ' 최장' : ''}` : ''}</div>`;
    sec.appendChild(row);
  });
  return sec;
}

// ---- period renderers ----
function renderStats() {
  const wrap = document.getElementById('statsWrap');
  wrap.innerHTML = '';
  document.querySelectorAll('#statsToggle button').forEach(b =>
    b.classList.toggle('selected', b.dataset.period === statsPeriod));
  if (statsPeriod === 'week') renderStatsWeek(wrap);
  else if (statsPeriod === 'year') renderStatsYear(wrap);
  else renderStatsMonth(wrap);
}

function renderStatsWeek(wrap) {
  const ws = weekStart(currentDate);
  const dates = datesRange(ws, 7);
  const prevDates = datesRange(new Date(ws.getTime() - 7 * 86400000), 7);

  const cur = blocksMinutes(dates).grand;
  const prev = blocksMinutes(prevDates).grand;
  const t = todoStatsFor(dates), tp = todoStatsFor(prevDates);
  const pct = t.total ? Math.round(t.done / t.total * 100) : null;
  const pctPrev = tp.total ? Math.round(tp.done / tp.total * 100) : null;
  const ha = habitAvgPct(dates), hap = habitAvgPct(prevDates);

  wrap.appendChild(buildCards([
    { label: '이번 주 기록 시간', value: fmtMinutes(cur), sub: deltaHtml(cur, prev, fmtMinutes, '주') },
    { label: '할일 완료율', value: pct != null ? pct + '%' : '-',
      sub: (pct != null && pctPrev != null) ? deltaHtml(pct, pctPrev, v => v + '%p', '주')
        : (t.total ? `${t.done}/${t.total}개 완료` : '이번 주 할일 없음') },
    { label: '습관 평균 달성률', value: ha != null ? ha + '%' : '-',
      sub: (ha != null && hap != null) ? deltaHtml(ha, hap, v => v + '%p', '주') : '습관 없음' },
  ]));

  wrap.appendChild(buildTrendSection(dates.map((ds, i) => ({
    ds, label: WEEKDAYS[i], tip: formatDate(ds),
  }))));

  const goalSec = buildGoalSection(dates, '🎯 주간 목표');
  if (goalSec) { goalSec.style.marginBottom = '8px'; wrap.appendChild(goalSec); }

  const chartSec = document.createElement('div');
  chartSec.innerHTML = '<div class="p-section-title" style="margin-bottom:10px">📈 요일별 기록 시간</div>';
  if (!cur) {
    chartSec.innerHTML += '<div class="stat-empty">이번 주 타임블록 기록이 없습니다.</div>';
  } else {
    const segs = topCatSegs(dates);
    const today = todayStr();
    chartSec.appendChild(buildStackedChart(dates.map((ds, i) => ({
      seg: segs[i],
      label: WEEKDAYS[i],
      tip: formatDate(ds),
      highlight: ds === today,
    }))));
  }
  chartSec.style.marginBottom = '24px';
  wrap.appendChild(chartSec);

  wrap.appendChild(buildCatTimeSection(dates, '이번 주 기록이 없습니다.'));
  wrap.appendChild(buildSuccSection(dates, '이번 주 할일·습관 데이터가 없습니다.'));
  wrap.appendChild(buildHabitSection(dates, 'current'));
}

function renderStatsMonth(wrap) {
  const yr = currentDate.getFullYear(), mo = currentDate.getMonth();
  const dates = monthDatesOf(yr, mo);
  const pm = new Date(yr, mo - 1, 1);
  const prevDates = monthDatesOf(pm.getFullYear(), pm.getMonth());

  const cur = blocksMinutes(dates).grand;
  const prev = blocksMinutes(prevDates).grand;
  const t = todoStatsFor(dates), tp = todoStatsFor(prevDates);
  const pct = t.total ? Math.round(t.done / t.total * 100) : null;
  const pctPrev = tp.total ? Math.round(tp.done / tp.total * 100) : null;
  const ha = habitAvgPct(dates), hap = habitAvgPct(prevDates);

  wrap.appendChild(buildCards([
    { label: '이번 달 기록 시간', value: fmtMinutes(cur), sub: deltaHtml(cur, prev, fmtMinutes, '달') },
    { label: '할일 완료율', value: pct != null ? pct + '%' : '-',
      sub: (pct != null && pctPrev != null) ? deltaHtml(pct, pctPrev, v => v + '%p', '달')
        : (t.total ? `${t.done}/${t.total}개 완료` : '이번 달 할일 없음') },
    { label: '습관 평균 달성률', value: ha != null ? ha + '%' : '-',
      sub: (ha != null && hap != null) ? deltaHtml(ha, hap, v => v + '%p', '달') : '습관 없음' },
  ]));

  wrap.appendChild(buildTrendSection(dates.map((ds, i) => ({
    ds,
    label: (i === 0 || (i + 1) % 5 === 0) ? String(i + 1) : '',
    tip: `${mo + 1}/${i + 1}`,
  }))));

  const goalSec = buildGoalSection(dates, '🎯 월간 목표 (주간 목표 환산)');
  if (goalSec) { goalSec.style.marginBottom = '8px'; wrap.appendChild(goalSec); }

  const chartSec = document.createElement('div');
  chartSec.innerHTML = '<div class="p-section-title" style="margin-bottom:10px">📈 일별 기록 시간</div>';
  if (!cur) {
    chartSec.innerHTML += '<div class="stat-empty">이번 달 타임블록 기록이 없습니다. 일간 뷰에서 색칠해보세요.</div>';
  } else {
    const segs = topCatSegs(dates);
    const today = todayStr();
    chartSec.appendChild(buildStackedChart(dates.map((ds, i) => ({
      seg: segs[i],
      label: (i === 0 || (i + 1) % 5 === 0) ? String(i + 1) : '',
      tip: `${mo + 1}/${i + 1}`,
      highlight: ds === today,
    }))));

    // week-of-month subtotals
    const weekTotals = [];
    let idx = 0;
    while (idx < dates.length) {
      const d = new Date(dates[idx] + 'T00:00:00');
      const chunkEnd = Math.min(dates.length, idx + (7 - d.getDay()));
      let sum = 0;
      for (let i = idx; i < chunkEnd; i++) sum += dayLogTotal(dates[i]);
      weekTotals.push(sum);
      idx = chunkEnd;
    }
    const sub = document.createElement('div');
    sub.style.cssText = 'font-size:11px;color:var(--text2);margin-top:8px';
    sub.textContent = weekTotals.map((m, i) => `${i + 1}주차 ${m ? fmtMinutes(m) : '0분'}`).join(' · ');
    chartSec.appendChild(sub);
  }
  chartSec.style.marginBottom = '24px';
  wrap.appendChild(chartSec);

  wrap.appendChild(buildCatTimeSection(dates, '이번 달 타임블록 기록이 없습니다. 일간 뷰에서 색칠해보세요.'));
  wrap.appendChild(buildSuccSection(dates, '이번 달 할일·습관 데이터가 없습니다.'));
  wrap.appendChild(buildHabitSection(dates, 'current'));
}

function renderStatsYear(wrap) {
  const yr = currentDate.getFullYear();
  const start = new Date(yr, 0, 1);
  const nDays = Math.round((new Date(yr + 1, 0, 1) - start) / 86400000);
  const dates = datesRange(start, nDays);

  const { grand } = blocksMinutes(dates);
  const t = todoStatsFor(dates);
  const daysRecorded = dates.filter(ds => dayLogTotal(ds) > 0).length;

  let bestStreak = 0, bestHb = null;
  habits.forEach(hb => {
    let cur = 0, best = 0;
    dates.forEach(ds => {
      if ((habitChecks[ds] || []).includes(hb.id)) { cur++; best = Math.max(best, cur); }
      else cur = 0;
    });
    if (best > bestStreak) { bestStreak = best; bestHb = hb; }
  });

  wrap.appendChild(buildCards([
    { label: `${yr}년 총 기록 시간`, value: fmtMinutes(grand), sub: `기록한 날 ${daysRecorded}일` },
    { label: '완료한 할일', value: t.done + '개', sub: t.total ? `완료율 ${Math.round(t.done / t.total * 100)}%` : '할일 없음' },
    { label: '최장 습관 스트릭', value: bestStreak ? bestStreak + '일' : '-', sub: bestHb ? escHtml(bestHb.name) : '습관 없음' },
  ]));

  // GitHub-style heatmap: darker = more recorded minutes
  const heatSec = document.createElement('div');
  heatSec.innerHTML = '<div class="p-section-title" style="margin-bottom:10px">🌱 기록 히트맵</div>';
  const hs = document.createElement('div');
  hs.className = 'heatmap-scroll';
  const hm = document.createElement('div');
  hm.className = 'heatmap';
  for (let i = 0; i < start.getDay(); i++) {
    const pad = document.createElement('div');
    pad.style.visibility = 'hidden';
    pad.className = 'hm-cell';
    hm.appendChild(pad);
  }
  const levelColor = min => {
    if (!min) return '';
    if (min < 60) return 'rgba(92,107,192,0.3)';
    if (min < 120) return 'rgba(92,107,192,0.55)';
    if (min < 240) return 'rgba(92,107,192,0.8)';
    return '#5C6BC0';
  };
  dates.forEach(ds => {
    const min = dayLogTotal(ds);
    const cell = document.createElement('div');
    cell.className = 'hm-cell';
    const c = levelColor(min);
    if (c) cell.style.background = c;
    if (ds === todayStr()) cell.style.outline = '1.5px solid var(--danger)';
    cell.title = `${formatDate(ds)} · ${min ? fmtMinutes(min) : '기록 없음'}`;
    hm.appendChild(cell);
  });
  hs.appendChild(hm);
  heatSec.appendChild(hs);
  const hLegend = document.createElement('div');
  hLegend.className = 'chart-legend';
  hLegend.innerHTML = `
    <span><span class="hm-cell" style="display:inline-block"></span> 0</span>
    <span><span class="hm-cell" style="display:inline-block;background:rgba(92,107,192,0.3)"></span> 1시간↓</span>
    <span><span class="hm-cell" style="display:inline-block;background:rgba(92,107,192,0.55)"></span> 2시간↓</span>
    <span><span class="hm-cell" style="display:inline-block;background:rgba(92,107,192,0.8)"></span> 4시간↓</span>
    <span><span class="hm-cell" style="display:inline-block;background:#5C6BC0"></span> 4시간↑</span>`;
  heatSec.appendChild(hLegend);
  heatSec.style.marginBottom = '24px';
  wrap.appendChild(heatSec);

  // monthly stacked bars
  const chartSec = document.createElement('div');
  chartSec.innerHTML = '<div class="p-section-title" style="margin-bottom:10px">📈 월별 기록 시간</div>';
  if (!grand) {
    chartSec.innerHTML += '<div class="stat-empty">올해 타임블록 기록이 없습니다.</div>';
  } else {
    const cols = Array.from({ length: 12 }, (_, m) => {
      const mDates = monthDatesOf(yr, m);
      const segs = topCatSegs(mDates);
      const merged = {};
      segs.forEach(s => { for (const id in s) merged[id] = (merged[id] || 0) + s[id]; });
      return { seg: merged, label: (m + 1) + '월', tip: `${yr}년 ${m + 1}월`, highlight: false };
    });
    chartSec.appendChild(buildStackedChart(cols));
  }
  chartSec.style.marginBottom = '24px';
  wrap.appendChild(chartSec);

  // 월별 추이 라인: 기록 시간 합계 · 평균 별점
  const trendSec = document.createElement('div');
  trendSec.innerHTML = '<div class="p-section-title" style="margin:24px 0 2px">📉 추이 그래프</div>';
  const mTime = [], mRate = [];
  for (let m = 0; m < 12; m++) {
    const md = monthDatesOf(yr, m);
    mTime.push(md.reduce((s, d) => s + dayLogTotal(d), 0));
    const rs = md.map(d => dayRatings[d]).filter(v => v != null);
    mRate.push(rs.length ? Math.round(rs.reduce((a, b) => a + b, 0) / rs.length * 10) / 10 : null);
  }
  const cap1 = document.createElement('div');
  cap1.className = 'trend-caption';
  cap1.textContent = '⏱ 월별 기록 시간';
  trendSec.appendChild(cap1);
  const maxMT = Math.max(...mTime, 60);
  trendSec.appendChild(buildLineChart(
    mTime.map((v, m) => ({ v, label: (m + 1) + '월', tip: `${yr}년 ${m + 1}월 · ${fmtMinutes(v)}` })),
    { max: maxMT, color: 'var(--primary)', maxLabel: fmtMinutes(maxMT) }));
  const cap2 = document.createElement('div');
  cap2.className = 'trend-caption';
  cap2.textContent = '⭐ 월평균 별점 (10점 만점)';
  trendSec.appendChild(cap2);
  if (mRate.some(v => v != null)) {
    trendSec.appendChild(buildLineChart(
      mRate.map((v, m) => ({ v, label: (m + 1) + '월', tip: `${yr}년 ${m + 1}월 · ${v != null ? v + '점' : '평가 없음'}` })),
      { max: 10, color: '#F59E0B', maxLabel: '10점' }));
  } else {
    const e = document.createElement('div');
    e.className = 'stat-empty';
    e.textContent = '올해 별점 기록이 없습니다.';
    trendSec.appendChild(e);
  }
  trendSec.style.marginBottom = '24px';
  wrap.appendChild(trendSec);

  wrap.appendChild(buildCatTimeSection(dates, '올해 기록이 없습니다.'));
  wrap.appendChild(buildHabitSection(dates, 'best'));
}

// export the current stats period's time records as CSV (Excel-friendly BOM)
function statsPeriodDates() {
  if (statsPeriod === 'week') return datesRange(weekStart(currentDate), 7);
  if (statsPeriod === 'year') {
    const yr = currentDate.getFullYear();
    const s = new Date(yr, 0, 1);
    return datesRange(s, Math.round((new Date(yr + 1, 0, 1) - s) / 86400000));
  }
  return monthDatesOf(currentDate.getFullYear(), currentDate.getMonth());
}

document.getElementById('csvBtn').onclick = () => {
  const dates = statsPeriodDates();
  const rows = [['날짜', '이름', '유형', '카테고리', '분']];
  dates.forEach(ds => {
    const m = timeLog[ds] || {};
    for (const id in m) {
      const ev = events.find(x => x.id === id);
      const hb = habits.find(x => x.id === id);
      const src = ev || hb;
      if (!src) continue;
      rows.push([
        ds,
        ev ? ev.title : hb.name,
        ev ? (ev.isTodo ? '할일' : '일정') : '습관',
        src.categoryId && catById(src.categoryId) ? catPath(src.categoryId) : '',
        m[id],
      ]);
    }
  });
  if (rows.length === 1) { showToast('이 기간에 내보낼 기록이 없습니다'); return; }
  const csv = '\ufeff' + rows.map(r =>
    r.map(c => `"${String(c).split('"').join('""')}"`).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `시간기록_${statsPeriod}_${dates[0]}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`${rows.length - 1}건의 기록을 CSV로 내보냈습니다 ⬇`);
};

function runSearch(q) {
  const res = document.getElementById('searchResults');
  res.innerHTML = '';
  q = q.trim().toLowerCase();
  if (!q) return;

  const rows = [];
  events.forEach(ev => {
    if ((ev.title || '').toLowerCase().includes(q) || (ev.desc || '').toLowerCase().includes(q)) {
      rows.push({
        color: ev.color || COLORS[0],
        title: ev.title,
        meta: (ev.isTodo
          ? (ev.scope === 'month' ? '🗓 월간 할일' : ev.scope === 'week' ? '📆 주간 할일' : '할일')
          : '일정') + (ev.date ? ' · ' + formatDate(ev.date) : ''),
        onclick: () => { closeSearch(); openEdit(ev); }
      });
    }
  });
  habits.forEach(hb => {
    if ((hb.name || '').toLowerCase().includes(q)) {
      rows.push({
        color: hb.color,
        title: hb.name,
        meta: '습관',
        onclick: () => { closeSearch(); openHabitModal(hb); }
      });
    }
  });
  const goToDay = ds => () => {
    closeSearch();
    currentDate = new Date(ds + 'T00:00:00');
    switchView('day');
  };
  for (const ds in dayMemos) {
    if (dayMemos[ds].toLowerCase().includes(q)) {
      rows.push({ color: '#64748B', title: dayMemos[ds].slice(0, 60), meta: '메모 · ' + formatDate(ds), onclick: goToDay(ds) });
    }
  }
  for (const ds in dayGoals) {
    if (dayGoals[ds].toLowerCase().includes(q)) {
      rows.push({ color: '#64748B', title: dayGoals[ds].slice(0, 60), meta: '목표 · ' + formatDate(ds), onclick: goToDay(ds) });
    }
  }
  for (const ds in dayBad) {
    if (dayBad[ds].toLowerCase().includes(q)) {
      rows.push({ color: '#64748B', title: dayBad[ds].slice(0, 60), meta: '반성 · ' + formatDate(ds), onclick: goToDay(ds) });
    }
  }

  if (!rows.length) {
    res.innerHTML = '<div style="text-align:center;color:var(--text2);padding:18px 0;font-size:13px">검색 결과가 없습니다</div>';
    return;
  }
  rows.slice(0, 30).forEach(r => {
    const row = document.createElement('div');
    row.className = 'day-event-row';
    row.innerHTML = `
      <div class="day-event-accent" style="background:${r.color}"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(r.title)}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:2px">${r.meta}</div>
      </div>`;
    row.onclick = r.onclick;
    res.appendChild(row);
  });
}

// ===== TODO =====
function renderTodo() {
  const list = document.getElementById('todoList');
  const todos = events
    .filter(ev => ev.isTodo)
    .sort((a, b) => prioRank(a) - prioRank(b) || (a.date||'').localeCompare(b.date||''));
  const today = todayStr();

  if (!todos.length) {
    list.innerHTML = `<div class="empty-state"><div class="ei">✅</div><div class="em">할 일이 없습니다.<br>+ 버튼을 눌러 추가해보세요!</div></div>`;
    return;
  }

  const scopedM  = todos.filter(ev => ev.scope === 'month' && !isTodoDone(ev, today));
  const scopedW  = todos.filter(ev => ev.scope === 'week' && !isTodoDone(ev, today));
  const plain    = todos.filter(ev => !ev.scope);
  const endOf    = ev => ev.endDate || ev.date; // 기간 할일은 종료일이 기한
  const overdue  = plain.filter(ev => ev.date && endOf(ev) < today && !(ev.repeat && ev.repeat !== 'none') && !isTodoDone(ev, today));
  const todayTds = plain.filter(ev => ev.date === today ||
    (ev.endDate && ev.date <= today && today <= ev.endDate) ||
    (ev.repeat && ev.repeat !== 'none' && evMatchesDate(ev, today)));
  const upcoming = plain.filter(ev => ev.date && ev.date > today && !isTodoDone(ev, today));
  const noDate   = plain.filter(ev => !ev.date && !isTodoDone(ev, today));
  const doneAll  = todos.filter(ev => isTodoDone(ev, today));
  // non-repeating todos completed 14+ days ago move to the archive
  const cutoff = ymd(new Date(Date.now() - 14 * 86400000));
  const archived = doneAll.filter(ev =>
    !(ev.repeat && ev.repeat !== 'none') && ev.completedAt && ev.completedAt < cutoff);
  const done = doneAll.filter(ev => !archived.includes(ev));

  list.innerHTML = '';
  if (overdue.length)  renderTodoSection(list, '⚠️ 기한 초과', overdue);
  if (todayTds.length) renderTodoSection(list, '📌 오늘', todayTds);
  if (scopedW.length)  renderTodoSection(list, '📆 주간 할일', scopedW);
  if (scopedM.length)  renderTodoSection(list, '🗓 월간 할일', scopedM);
  if (upcoming.length) renderTodoSection(list, '📅 예정', upcoming);
  if (noDate.length)   renderTodoSection(list, '📝 날짜 없음', noDate);
  if (done.length)     renderTodoSection(list, `✅ 완료 (${done.length})`, done, 'done');
  if (archived.length) renderTodoSection(list, `🗄 보관됨 (${archived.length})`, archived, 'arch');
}

const sectionOpen = { done: false, arch: false }; // collapsed by default

function renderTodoSection(container, heading, items, collapseKey) {
  const sec = document.createElement('div');
  sec.className = 'todo-section';
  const title = document.createElement('div');
  title.className = 'todo-section-title';
  const open = collapseKey ? sectionOpen[collapseKey] : true;
  title.textContent = collapseKey ? `${heading} ${open ? '▾' : '▸ (눌러서 펼치기)'}` : heading;
  if (collapseKey) {
    title.style.cursor = 'pointer';
    title.onclick = () => { sectionOpen[collapseKey] = !open; renderTodo(); };
  }
  sec.appendChild(title);
  container.appendChild(sec);
  if (collapseKey && !open) return;

  items.forEach(ev => {
    const doneToday = isTodoDone(ev, todayStr());
    const item = document.createElement('div');
    item.className = 'todo-item' + (doneToday ? ' done' : '');

    const meta = [];
    if (ev.scope) meta.push(ev.scope === 'month'
      ? `🗓 ${ev.date ? parseInt(ev.date.slice(5, 7)) + '월' : ''} 월간 할일`
      : `📆 ${ev.date ? ev.date.slice(5).replace('-', '/') + '주' : ''} 주간 할일`);
    else if (ev.date && ev.endDate) meta.push(`${formatDate(ev.date)} ~ ${formatDate(ev.endDate)}`);
    else if (ev.date) meta.push(formatDate(ev.date));
    if (ev.time) meta.push(formatTime(ev.time));
    if (ev.repeat && ev.repeat !== 'none') meta.push('🔄 ' + repeatLabel(ev));
    if (ev.accuracy != null && ev.accuracy !== '') meta.push('🎯 ' + ev.accuracy + '%');
    if (ev.categoryId && catById(ev.categoryId)) meta.push('📁 ' + escHtml(catPath(ev.categoryId)));

    item.innerHTML = `
      <div class="todo-accent" style="background:${ev.color||COLORS[0]}"></div>
      <div class="todo-check">${doneToday ? '✓' : ''}</div>
      <div class="todo-content">
        <div class="todo-title">${PRIORITY_ICON[ev.priority || 'normal']} ${escHtml(ev.title)}</div>
        ${meta.length ? `<div class="todo-meta">${meta.join(' · ')}</div>` : ''}
        ${ev.desc ? `<div class="todo-meta">${escHtml(ev.desc)}</div>` : ''}
      </div>
    `;

    item.querySelector('.todo-check').onclick = e => {
      e.stopPropagation();
      const t = todayStr();
      setTodoDone(ev, t, !isTodoDone(ev, t));
      saveEvents();
      render();
    };
    item.onclick = () => openEdit(ev);
    sec.appendChild(item);
  });

  container.appendChild(sec);
}

function escHtml(s) {
  // tolerate missing fields from hand-edited/partial import files
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('evSaveBtn').onclick = () => {
  const title = document.getElementById('evTitle').value.trim();
  if (!title) { showToast('제목을 입력해주세요'); document.getElementById('evTitle').focus(); return; }

  const ev = {
    id: editingId || genId(),
    title,
    isTodo: isTodoMode,
    date: document.getElementById('evDate').value,
    endDate: document.getElementById('evEndDate').value,
    time: document.getElementById('evTime').value,
    endTime: document.getElementById('evEndTime').value,
    repeat: document.getElementById('evRepeat').value,
    repeatN: Math.max(1, parseInt(document.getElementById('evRepeatN').value) || 1),
    repeatEnd: document.getElementById('evRepeatEnd').value,
    notifyBefore: parseInt(document.getElementById('evNotify').value) || 0,
    accuracy: document.getElementById('evAccuracy').value === '' ? null :
      Math.min(100, Math.max(0, parseInt(document.getElementById('evAccuracy').value) || 0)),
    color: getColor(),
    priority: getPriority(),
    categoryId: document.getElementById('evCategory').value || null,
    scope: isTodoMode ? (document.getElementById('evScope').value || null) : null,
    desc: document.getElementById('evDesc').value.trim(),
    // For repeating todos completion lives in todoDone per date
    completed: isTodoMode && isCompleted &&
      document.getElementById('evRepeat').value === 'none',
  };
  // scoped todos need an anchor date to know which month/week they belong to,
  // and never carry a time or repeat rule
  if (ev.scope) {
    if (!ev.date) ev.date = todayStr();
    ev.time = '';
    ev.endTime = '';
    ev.repeat = 'none';
    ev.repeatEnd = '';
    ev.notifyBefore = 0;
    ev.endDate = '';
  }
  // period(기간) rules: no repeat combo; swap if reversed; drop when same day
  if (ev.repeat !== 'none') ev.endDate = '';
  if (ev.endDate && ev.date && ev.endDate < ev.date) {
    const tmp = ev.date; ev.date = ev.endDate; ev.endDate = tmp;
  }
  if (ev.endDate && ev.endDate === ev.date) ev.endDate = '';

  if (editingId) {
    const idx = events.findIndex(e => e.id === editingId);
    if (idx >= 0) {
      // keep the original completion date when it stays completed
      if (ev.completed) ev.completedAt = events[idx].completedAt || todayStr();
      events[idx] = ev;
    }
  } else {
    if (ev.completed) ev.completedAt = todayStr();
    events.push(ev);
  }

  saveEvents();
  scheduleNotifs();
  closeEventModal();
  render();
  showToast(editingId ? '수정되었습니다 ✓' : '추가되었습니다 ✓');
};

// ===== DELETE =====
function stripIdFromMaps(id) {
  for (const d in blocks) {
    for (const k in blocks[d]) {
      if (blocks[d][k] === id) {
        delete blocks[d][k];
        if (blockMin[d]) delete blockMin[d][k];
      }
    }
    if (!Object.keys(blocks[d]).length) delete blocks[d];
    if (blockMin[d] && !Object.keys(blockMin[d]).length) delete blockMin[d];
  }
  for (const d in timeLog) {
    if (timeLog[d][id] != null) delete timeLog[d][id];
    if (!Object.keys(timeLog[d]).length) delete timeLog[d];
  }
  if (paintTaskId === id) paintTaskId = null;
  if (recording && recording.id === id) stopRecording();
}

function deleteEventById(id) {
  events = events.filter(e => e.id !== id);
  for (const d in dayTasks) {
    dayTasks[d] = dayTasks[d].filter(x => x !== id);
    if (!dayTasks[d].length) delete dayTasks[d];
  }
  for (const d in todoDone) {
    todoDone[d] = todoDone[d].filter(x => x !== id);
    if (!todoDone[d].length) delete todoDone[d];
  }
  stripIdFromMaps(id);
  saveEvents();
}

function deleteHabitById(id) {
  habits = habits.filter(h => h.id !== id);
  for (const d in habitChecks) {
    habitChecks[d] = habitChecks[d].filter(x => x !== id);
    if (!habitChecks[d].length) delete habitChecks[d];
  }
  stripIdFromMaps(id);
  saveEvents();
}

// ===== NOTIFICATIONS =====
async function requestNotifPerm() {
  if ('Notification' in window && Notification.permission === 'default') {
    await Notification.requestPermission();
  }
}

function scheduleNotifs() {
  notifTimers.forEach(clearTimeout);
  notifTimers = [];
  if (!('Notification' in window) || Notification.permission !== 'granted') return;

  const now = new Date();
  const today = todayStr();

  events.forEach(ev => {
    if (!ev.time || !ev.notifyBefore || !ev.date) return;
    if (!evMatchesDate(ev, today) && ev.date !== today) return;

    const evTime = new Date(`${today}T${ev.time}`);
    const notifAt = new Date(evTime.getTime() - ev.notifyBefore * 60000);
    const delay = notifAt.getTime() - now.getTime();

    if (delay > 0 && delay < 86400000) {
      const t = setTimeout(() => {
        new Notification(`⏰ ${ev.title}`, {
          body: `${ev.notifyBefore}분 후 시작 (${formatTime(ev.time)})`,
          icon: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='
        });
      }, delay);
      notifTimers.push(t);
    }
  });
}

// ===== BACKUP =====
const DATA_FILENAME = 'schedule_data.json';

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('schedulerFsDB', 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('handles')) db.createObjectStore('handles');
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbGet(store, key) {
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const rq = tx.objectStore(store).get(key);
    rq.onsuccess = () => resolve(rq.result || null);
    rq.onerror = () => reject(rq.error);
  }));
}

function idbSet(store, key, val) {
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

// Photos live in IndexedDB (hundreds of MB) instead of localStorage (~5MB)
function saveImages() {
  idbSet('kv', 'dayImages', dayImages).catch(err => console.error('image save failed', err));
  mirrorPhotosToFolder(); // also drop real .jpg files into data/photo/
}

// Mirror photos as browsable .jpg files under data/photo/. One-way: dayImages is
// the source; files are named by content hash so reorder/delete stays consistent.
// Photos also stay embedded in schedule_data.json, so this folder is a bonus copy —
// deleting it loses nothing.
function photoHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}

let photoMirrorBusy = false;
async function mirrorPhotosToFolder() {
  if (!dataDirHandle || photoMirrorBusy) return;
  photoMirrorBusy = true;
  try {
    if (!(await verifyPermission(dataDirHandle, false))) return;
    const dir = await dataDirHandle.getDirectoryHandle('photo', { create: true });

    const desired = new Map(); // filename -> dataURL
    for (const ds in dayImages) {
      dayImages[ds].forEach(url => desired.set(`${ds}_${photoHash(url)}.jpg`, url));
    }
    const existing = new Set();
    for await (const [name, h] of dir.entries()) {
      if (h.kind === 'file' && name.endsWith('.jpg')) existing.add(name);
    }
    // write new photos
    for (const [name, url] of desired) {
      if (existing.has(name)) continue;
      const blob = await (await fetch(url)).blob();
      const fh = await dir.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(blob);
      await w.close();
    }
    // remove photos that were deleted from the app
    for (const name of existing) {
      if (!desired.has(name)) await dir.removeEntry(name).catch(() => {});
    }
  } catch (err) {
    console.error('photo mirror failed', err);
  } finally {
    photoMirrorBusy = false;
  }
}

async function loadImages() {

async function verifyPermission(handle, allowPrompt) {

  if ((await handle.queryPermission(opts)) === 'granted') return true;

  return false;
}

// Reads schedule_data.json from the connected folder, if present, and loads it
// as the current state. Returns true if data was loaded, false if no file exists yet.
async function loadFromDataDir(dir) {
  let fileHandle;
  try {
    fileHandle = await dir.getFileHandle(DATA_FILENAME);
  } catch {
    return false; // no file yet in this folder
  }
  const file = await fileHandle.getFile();
  const text = await file.text();
  const data = JSON.parse(text);
  if (!Array.isArray(data.events)) throw new Error('invalid data file');
  events = data.events;
  blocks = data.blocks || {};
  blockMin = data.blockMin || {};
  dayTasks = data.dayTasks || {};
  dayGoals = data.dayGoals || {};
  dayMemos = data.dayMemos || {};
  dayBad = data.dayBad || {};
  dayRatings = data.dayRatings || {};
  sleepLog = data.sleepLog || {};
  habits = data.habits || [];
  habitChecks = data.habitChecks || {};
  todoDone = data.todoDone || {};
  categories = data.categories || [];
  if (data.timeLog) timeLog = data.timeLog;
  else rebuildTimeLogFromBlocks(); // older backup without the minute ledger
  if (data.dayImages) { dayImages = data.dayImages; saveImages(); }
  persistLocal();
  scheduleNotifs();
  render();
  return true;
}

async function restoreDataDir() {
  const stored = await idbGet('handles', 'dataDir').catch(() => null);
  if (stored && (await verifyPermission(stored, false))) {
    dataDirHandle = stored;
    updateConnectBtn(true);
    try {
      const loaded = await loadFromDataDir(stored);
      if (loaded) showToast('data 폴더의 최신 데이터를 불러왔습니다 ✓');
    } catch (err) {
      console.error('auto load failed', err);
    }
    mirrorPhotosToFolder(); // ensure photo/ folder matches current photos
  } else {
    updateConnectBtn(false);
  }
}

async function connectDataDir() {
  try {
    const handle = await window.showDirectoryPicker({ id: 'schedulerData', mode: 'readwrite' });
    if (!(await verifyPermission(handle, true))) throw new Error('permission-denied');
    dataDirHandle = handle;
    await idbSet('handles', 'dataDir', handle);
    updateConnectBtn(true);

    const loaded = await loadFromDataDir(handle).catch(err => { console.error(err); return false; });
    if (loaded) {
      showToast('data 폴더의 기존 데이터를 불러왔습니다 ✓');
    } else {
      showToast('data 폴더에 연결되었습니다. 이제부터 자동 저장됩니다 ✓');
      autoSyncToFile();
    }
    mirrorPhotosToFolder(); // write existing photos into data/photo/
  } catch (err) {
    if (err.name === 'AbortError') return;
    console.error(err);
    showToast('폴더 연결에 실패했습니다');
  }
}

async function autoSyncToFile() {
  if (!dataDirHandle) return;
  if (!(await verifyPermission(dataDirHandle, false))) { updateConnectBtn(false); return; }
  try {
    const data = { version: 3, exported: new Date().toISOString(), events, blocks, blockMin, timeLog, dayTasks, dayGoals, dayMemos, dayBad, dayRatings, sleepLog, habits, habitChecks, todoDone, categories, dayImages };
    const fileHandle = await dataDirHandle.getFileHandle(DATA_FILENAME, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(data, null, 2));
    await writable.close();

    // Weekly snapshot so an accidental overwrite is recoverable.
    // Photos are excluded (they live in the main file) to keep snapshots small.
    const last = localStorage.getItem('lastSnapshot');
    const today = todayStr();
    if (!last || (new Date(today) - new Date(last)) >= 7 * 86400000) {
      const snapData = { ...data };
      delete snapData.dayImages;
      const snapHandle = await dataDirHandle.getFileHandle(`schedule_backup_${today}.json`, { create: true });
      const sw = await snapHandle.createWritable();
      await sw.write(JSON.stringify(snapData, null, 2));
      await sw.close();
      localStorage.setItem('lastSnapshot', today);

      // keep only the 8 most recent snapshots
      try {
        const names = [];
        for await (const name of dataDirHandle.keys()) {
          if (/^schedule_backup_\d{4}-\d{2}-\d{2}\.json$/.test(name)) names.push(name);
        }
        names.sort().reverse().slice(8).forEach(n => dataDirHandle.removeEntry(n).catch(() => {}));
      } catch (err) {
        console.error('snapshot cleanup failed', err);
      }
    }
  } catch (err) {
    console.error('auto sync failed', err);
  }
}

  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data.events)) throw new Error();
      if (!confirm(`${data.events.length}개의 일정을 가져올까요?\n(현재 데이터를 이 파일 내용으로 완전히 교체합니다)`)) return;
      const backed = await backupBeforeImport();
      if (backed) showToast('교체 전 데이터를 data 폴더에 백업했습니다 🛟');
      events = data.events;
      blocks = data.blocks || {};
      blockMin = data.blockMin || {};
      dayTasks = data.dayTasks || {};
      dayGoals = data.dayGoals || {};
      dayMemos = data.dayMemos || {};
  dayBad = data.dayBad || {};
  dayRatings = data.dayRatings || {};
  sleepLog = data.sleepLog || {};
      habits = data.habits || [];
      habitChecks = data.habitChecks || {};
      todoDone = data.todoDone || {};
      categories = data.categories || [];
      if (data.timeLog) timeLog = data.timeLog;
      else rebuildTimeLogFromBlocks();
      if (data.dayImages) { dayImages = data.dayImages; saveImages(); }
      saveEvents();
      scheduleNotifs();
      render();
      showToast(`${events.length}개 일정을 불러왔습니다 ⬆`);
    } catch {
      showToast('파일 형식이 올바르지 않습니다');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
};

// ===== DATA HYGIENE (run once at load) =====
function pruneOrphans() {
  const validIds = new Set([...events.map(e => e.id), ...habits.map(h => h.id)]);
  const pruneList = obj => {
    for (const d in obj) {
      obj[d] = obj[d].filter(id => validIds.has(id));
      if (!obj[d].length) delete obj[d];
    }
  };
  pruneList(todoDone);
  pruneList(habitChecks);
  pruneList(dayTasks);
  for (const d in blocks) {
    for (const k in blocks[d]) {
      if (!validIds.has(blocks[d][k])) {
        delete blocks[d][k];
        if (blockMin[d]) delete blockMin[d][k];
      }
    }
    if (!Object.keys(blocks[d]).length) delete blocks[d];
  }
  // drop fill data whose block no longer exists
  for (const d in blockMin) {
    for (const k in blockMin[d]) if (!blocks[d] || !(k in blocks[d])) delete blockMin[d][k];
    if (!Object.keys(blockMin[d]).length) delete blockMin[d];
  }
  for (const d in timeLog) {
    for (const id in timeLog[d]) if (!validIds.has(id)) delete timeLog[d][id];
    if (!Object.keys(timeLog[d]).length) delete timeLog[d];
  }
  // legacy completed todos get a completion date so archiving can work
  events.forEach(ev => {
    if (ev.isTodo && ev.completed && !ev.completedAt) ev.completedAt = todayStr();
  });
}

// ===== LIVE RECORDING (auto-paint the current 10-min block) =====
let recording = null; // { id: taskOrHabitId, startedAt: epoch ms }
try { recording = JSON.parse(localStorage.getItem('recording_v1') || 'null'); } catch { recording = null; }
if (recording && !recording.startedAt) recording.startedAt = Date.now();
let lastRecordedKey = null;

function fmtElapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${pad2(Math.floor(s / 3600))}:${pad2(Math.floor(s % 3600 / 60))}:${pad2(s % 60)}`;
}

function updateRecBar() {
  const bar = document.getElementById('recBar');
  const chip = document.getElementById('recChip');
  const src = recording ? findPaintable(recording.id) : null;

  if (!recording || !src) {
    bar.style.display = 'none';
    chip.style.display = 'none';
    return;
  }
  const elapsed = fmtElapsed(Date.now() - recording.startedAt);

  bar.style.display = '';
  document.getElementById('rbDot').style.background = src.color;
  document.getElementById('rbTitle').textContent = src.title;
  document.getElementById('rbElapsed').textContent = elapsed;
  document.getElementById('rbTotal').textContent = `오늘 ${fmtMinutes(paintedMinutes(todayStr(), recording.id))}`;

  // header chip so the running timer is visible on every view
  chip.style.display = 'flex';
  document.getElementById('recChipTime').textContent = elapsed;
  chip.title = `⏺ ${src.title} 기록 중 — 클릭하여 중지`;
}

document.getElementById('rbStop').onclick = () => {
  stopRecording();
  render();
};

document.getElementById('recChip').onclick = () => {
  stopRecording();
  render();
  showToast('타이머를 중지했습니다 ■');
};

function recordTick() {
  if (!recording) return;
  if (!findPaintable(recording.id)) { stopRecording(); return; }
  const now = new Date();
  const minuteStamp = Math.floor(now.getTime() / 60000);
  if (recording.lastMin == null) recording.lastMin = minuteStamp;

  let minuteChanged = false;
  let blockChanged = false;

  const takeBlock = (dds, bkey) => {
    if (!blocks[dds]) blocks[dds] = {};
    if (!blockMin[dds]) blockMin[dds] = {};
    if (blocks[dds][bkey] !== recording.id) {
      const old = blocks[dds][bkey];
      if (old) addLog(dds, old, -(blockMin[dds][bkey] == null ? 10 : blockMin[dds][bkey]));
      blocks[dds][bkey] = recording.id;
      blockMin[dds][bkey] = 0;
      blockChanged = true;
    }
  };

  // credit each completed minute: +1 to the ledger and +1 to its 10-min block fill
  // (loop also backfills minutes that passed while the page was closed)
  for (let m = recording.lastMin; m < minuteStamp; m++) {
    const t = new Date(m * 60000);
    const dds = ymd(t);
    const bkey = `${pad2(t.getHours())}:${pad2(Math.floor(t.getMinutes() / 10) * 10)}`;
    addLog(dds, recording.id, 1);
    takeBlock(dds, bkey);
    blockMin[dds][bkey] = Math.min(10, (blockMin[dds][bkey] || 0) + 1);
    minuteChanged = true;
  }
  if (minuteStamp > recording.lastMin) {
    recording.lastMin = minuteStamp;
    localStorage.setItem('recording_v1', JSON.stringify(recording));
  }

  // claim the current block right away (thin sliver until the first minute lands)
  const ds = ymd(now);
  const key = `${pad2(now.getHours())}:${pad2(Math.floor(now.getMinutes() / 10) * 10)}`;
  if (lastRecordedKey !== ds + key) {
    takeBlock(ds, key);
    lastRecordedKey = ds + key;
  }

  if (blockChanged) saveEvents();
  else if (minuteChanged) persistLocal(); // light save; file sync happens on block changes

  if (minuteChanged || blockChanged) {
    updateRecBar();
    renderWidget();
    // don't rebuild the grid mid-drag: pointerup re-renders anyway
    if (currentView === 'day' && ymd(currentDate) === ds && !painting) renderDay();
  }
}

function updateRecordBtn() {
  const btn = document.getElementById('recordBtn');
  if (recording) {
    const src = findPaintable(recording.id);
    btn.textContent = `⏺ ${src ? src.title : ''} 기록 중 — 중지`;
    btn.classList.add('recording');
  } else {
    btn.textContent = '▶ 지금 기록';
    btn.classList.remove('recording');
  }
}

function startRecording(id) {
  recording = { id, startedAt: Date.now(), lastMin: Math.floor(Date.now() / 60000) };
  localStorage.setItem('recording_v1', JSON.stringify(recording));
  lastRecordedKey = null;
  updateRecordBtn();
  updateRecBar();
  recordTick();
}

function stopRecording() {
  recording = null;
  localStorage.removeItem('recording_v1');
  updateRecordBtn();
  updateRecBar();
}

document.getElementById('recordBtn').onclick = () => {
  if (recording) {
    stopRecording();
    showToast('기록을 중지했습니다');
    return;
  }
  if (!paintTaskId || paintTaskId === 'ERASE') {
    showToast('먼저 TO DO LIST에서 할일이나 습관을 선택하세요');
    return;
  }
  startRecording(paintTaskId);
  showToast('지금부터 10분 블록에 자동 기록됩니다 ⏺');
};

// ===== FLOATING WIDGET (Document Picture-in-Picture) =====
let pipWin = null;

function updateWidgetBtn() {
  document.getElementById('widgetBtn').style.opacity = pipWin ? '1' : '0.55';
}

async function toggleWidget() {
  if (pipWin) {
    pipWin.close();
    pipWin = null;
    updateWidgetBtn();
    return;
  }
  if (!('documentPictureInPicture' in window)) {
    showToast('이 브라우저는 위젯 모드를 지원하지 않습니다 (Chrome/Edge 116 이상 필요)');
    return;
  }
  try {
    pipWin = await documentPictureInPicture.requestWindow({ width: 270, height: 380 });
  } catch (err) {
    console.error(err);
    showToast('위젯 창을 열 수 없습니다');
    return;
  }
  const style = pipWin.document.createElement('style');
  style.textContent = document.querySelector('style').textContent;
  pipWin.document.head.appendChild(style);
  pipWin.document.title = '스케줄러 위젯';
  pipWin.document.body.className = 'widget-body';
  pipWin.addEventListener('pagehide', () => { pipWin = null; updateWidgetBtn(); });
  updateWidgetBtn();
  renderWidget();
  showToast('위젯이 열렸습니다. 다른 창 위에 항상 표시됩니다 🧩');
}

function renderWidget() {
  if (!pipWin) return;
  const doc = pipWin.document;
  doc.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  const ds = todayStr();
  // keep what the user was typing in the quick-add input across re-renders
  const prevInput = doc.querySelector('.w-add-input');
  const prevVal = prevInput ? prevInput.value : '';
  const prevFocus = !!prevInput && doc.activeElement === prevInput;
  doc.body.innerHTML = '';
  const now = new Date();

  // Recording → focus mode: only the stopwatch, clock and date
  if (recording) {
    const src = findPaintable(recording.id);
    const focus = doc.createElement('div');
    focus.className = 'w-focus';
    focus.innerHTML = `
      <div class="w-focus-task"><span class="pc-dot" style="background:${src ? src.color : COLORS[0]}"></span><span class="w-focus-name">${src ? escHtml(src.title) : ''}</span></div>
      <div class="w-focus-elapsed" id="wElapsed">${fmtElapsed(Date.now() - recording.startedAt)}</div>
      <div class="w-focus-sub">오늘 누적 ${fmtMinutes(paintedMinutes(ds, recording.id))}</div>
      <div class="w-date"><span id="wClock">${pad2(now.getHours())}:${pad2(now.getMinutes())}</span> · ${now.getMonth()+1}/${now.getDate()} (${WEEKDAYS[now.getDay()]})</div>`;
    const stop = doc.createElement('button');
    stop.className = 'w-focus-stop';
    stop.textContent = '■ 중지';
    stop.onclick = () => { stopRecording(); render(); };
    focus.appendChild(stop);
    doc.body.appendChild(focus);
    return;
  }

  const wrap = doc.createElement('div');
  wrap.className = 'widget';

  const hp = habitProgress(ds), tp = todoProgress(ds);
  const head = doc.createElement('div');
  head.className = 'w-head';
  head.innerHTML = `
    <div class="w-clock" id="wClock">${pad2(now.getHours())}:${pad2(now.getMinutes())}</div>
    <div class="w-date">${now.getMonth()+1}/${now.getDate()} (${WEEKDAYS[now.getDay()]})${tp ? ` · ✅${tp.pct}%` : ''}${hp ? ` · 🔥${hp.pct}%` : ''}</div>`;
  wrap.appendChild(head);

  const hint = doc.createElement('div');
  hint.className = 'w-hint';
  hint.textContent = '줄 클릭 = 시간 기록 시작/중지 ⏺ · 동그라미 = 완료 체크';
  wrap.appendChild(hint);

  // one row for a todo or habit: circle checks, row toggles live recording,
  // ✕ deletes (press twice to confirm)
  const addWidgetRow = (id, title, color, checked, onCheck, onDelete) => {
    const isRec = recording && recording.id === id;
    const min = paintedMinutes(ds, id);
    const row = doc.createElement('div');
    row.className = 'w-item' + (checked ? ' done' : '') + (isRec ? ' recording' : '');
    row.innerHTML = `
      <span class="w-circle" style="border-color:${color}${checked ? `;background:${color}` : ''}">✓</span>
      <span class="w-title">${escHtml(title)}</span>
      ${min ? `<span class="w-min">${min}분</span>` : ''}
      ${isRec ? '<span class="w-recdot">⏺</span>' : ''}
      <button class="w-del" title="삭제 (두 번 눌러 확인)">✕</button>`;
    row.querySelector('.w-circle').onclick = e => {
      e.stopPropagation();
      onCheck();
      render();
    };
    row.querySelector('.w-del').onclick = e => {
      e.stopPropagation();
      const btn = e.target;
      if (btn.dataset.armed) {
        onDelete();
        render();
      } else {
        btn.dataset.armed = '1';
        btn.textContent = '확인';
        setTimeout(() => {
          if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = '✕'; }
        }, 2500);
      }
    };
    row.onclick = () => {
      if (isRec) stopRecording();
      else startRecording(id);
      render();
    };
    wrap.appendChild(row);
  };

  const secT = doc.createElement('div');
  secT.className = 'w-sec';
  secT.textContent = '오늘 할일';
  wrap.appendChild(secT);

  // quick add: type a title and press Enter
  const addBox = doc.createElement('div');
  addBox.className = 'w-add';
  addBox.innerHTML = '<input class="w-add-input" placeholder="＋ 할일 입력 후 Enter">';
  const addInput = addBox.querySelector('input');
  addInput.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const title = addInput.value.trim();
    if (!title) return;
    addInput.value = ''; // clear so the re-render doesn't restore it
    // inherit color/category from an existing task with the same title
    const twin = events.find(ev =>
      (ev.title || '').trim().toLowerCase() === title.toLowerCase());
    events.push({
      id: genId(), title, isTodo: true, date: ds,
      time: '', endTime: '', repeat: 'none', repeatN: 1, repeatEnd: '',
      notifyBefore: 0, color: twin ? twin.color : COLORS[0],
      priority: 'normal', accuracy: null,
      categoryId: twin ? twin.categoryId || null : null,
      desc: '', completed: false,
    });
    saveEvents();
    render();
  };
  wrap.appendChild(addBox);
  if (prevVal) addInput.value = prevVal;
  if (prevFocus) setTimeout(() => {
    addInput.focus();
    addInput.setSelectionRange(addInput.value.length, addInput.value.length);
  }, 0);

  const todos = getDayTaskList(ds);
  if (!todos.length) {
    const e = doc.createElement('div');
    e.className = 'w-empty';
    e.textContent = '오늘 할일이 없습니다';
    wrap.appendChild(e);
  }
  todos.forEach(ev => {
    const done = isTodoDone(ev, ds);
    addWidgetRow(ev.id, ev.title, ev.color || COLORS[0], done,
      () => { setTodoDone(ev, ds, !done); saveEvents(); },
      () => {
        // pulled-in task: just remove it from today; otherwise delete for real
        if ((dayTasks[ds] || []).includes(ev.id) && !evMatchesDate(ev, ds)) {
          dayTasks[ds] = dayTasks[ds].filter(x => x !== ev.id);
          if (!dayTasks[ds].length) delete dayTasks[ds];
          saveEvents();
        } else {
          deleteEventById(ev.id);
        }
      });
  });

  if (habits.length) {
    const secH = doc.createElement('div');
    secH.className = 'w-sec';
    secH.textContent = '습관';
    wrap.appendChild(secH);
    habits.forEach(hb => {
      const checked = (habitChecks[ds] || []).includes(hb.id);
      addWidgetRow(hb.id, hb.name, hb.color, checked,
        () => { toggleHabit(hb.id, ds); }, // saves internally
        () => { deleteHabitById(hb.id); });
    });
  }

  doc.body.appendChild(wrap);
}

document.getElementById('widgetBtn').onclick = toggleWidget;

// ===== KEYBOARD SHORTCUTS =====
// 1~6: view switch, N: new item, T: today, ←/→: prev/next
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (document.querySelector('.modal-overlay.open')) return;

  const viewKeys = { '1': 'month', '2': 'week', '3': 'day', '4': 'habit', '5': 'todo', '6': 'stats' };
  if (viewKeys[e.key]) switchView(viewKeys[e.key]);
  else if (e.key === 'n' || e.key === 'N') openAdd(todayStr(), '');
  else if (e.key === 't' || e.key === 'T') { currentDate = new Date(); render(); }
  else if (e.key === '/') { e.preventDefault(); openSearch(); }
  else if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
  else if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
});

// keep two open tabs consistent: reload state when another tab saves
window.addEventListener('storage', e => {
  if (e.key && e.key.startsWith('sched_')) {
    loadEvents();
    render();
  }
});

// ===== INIT =====
if (!localStorage.getItem('sched_timelog_v1') && Object.keys(blocks).length) {
  rebuildTimeLogFromBlocks(); // first run after the 1-min ledger update
}
pruneOrphans();
requestNotifPerm();
scheduleNotifs();
loadImages();
updateRecordBtn();
updateWidgetBtn();
render();
updateClock();
setInterval(updateClock, 1000);

// Re-schedule at midnight
const now = new Date();
const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1).getTime();
setTimeout(() => { scheduleNotifs(); setInterval(scheduleNotifs, 86400000); }, midnight - Date.now());
</script>
